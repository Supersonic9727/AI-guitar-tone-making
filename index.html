const InteractiveKnob = React.memo(({ label, value, color, onChange, size='md' }) => {
  const [editing, setEditing] = useState(false);
  const [inputStr, setInputStr] = useState('');
  const dragging = useRef(false);
  const startY   = useRef(0);
  const startVal = useRef(value);
  const inputRef = useRef(null);
  const dim    = size==='lg' ? 72 : 56;
  const R      = size==='lg' ? 27 : 21;
  const Cx     = dim/2;
  const toRad  = deg => (deg-90)*(Math.PI/180);
  const START  = -135, ARC = 270;
  const valDeg = START+(value/100)*ARC;
  const arcPath = (from, to) => {
    const x1=Cx+R*Math.cos(toRad(from)), y1=Cx+R*Math.sin(toRad(from));
    const x2=Cx+R*Math.cos(toRad(to)),   y2=Cx+R*Math.sin(toRad(to));
    return `M${x1} ${y1} A${R} ${R} 0 ${Math.abs(to-from)>180?1:0} 1 ${x2} ${y2}`;
  };
  const onMouseDown = useCallback(e => {
    dragging.current=true; startY.current=e.clientY; startVal.current=value; e.preventDefault();
  }, [value]);
  useEffect(() => {
    const onMove = e => {
      if (!dragging.current) return;
      onChange(Math.max(0, Math.min(100, startVal.current+Math.round((startY.current-e.clientY)/2))));
    };
    const onUp = () => { dragging.current=false; };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, [onChange]);
  const openEdit = () => { setInputStr(String(value)); setEditing(true); };
  useEffect(() => { if (editing && inputRef.current) inputRef.current.focus(); }, [editing]);
  const commitEdit = () => {
    const n = parseInt(inputStr, 10);
    if (!isNaN(n)) onChange(Math.max(0, Math.min(100, n)));
    setEditing(false);
  };
  const ticks = Array.from({length:13}, (_,i) => {
    const angle = START+(i/12)*ARC;
    const inner=R+2, outer=R+5, ra=toRad(angle);
    return { x1:Cx+inner*Math.cos(ra), y1:Cx+inner*Math.sin(ra), x2:Cx+outer*Math.cos(ra), y2:Cx+outer*Math.sin(ra), lit:i<=Math.round((value/100)*12) };
  });
  const knobR = size==='lg' ? 14 : 11;
  return (
    <div className="flex flex-col items-center gap-1.5 select-none">
      <div className="relative cursor-ns-resize" onMouseDown={onMouseDown}>
        <svg width={dim} height={dim} viewBox={`0 0 ${dim} ${dim}`}>
          {ticks.map((t,i) => <line key={i} x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2} stroke={t.lit?color:'#3a3a3a'} strokeWidth="1.5" strokeLinecap="round"/>)}
          <path d={arcPath(START,START+ARC)} fill="none" stroke="#111827" strokeWidth="3" strokeLinecap="round"/>
          {value>0 && <path d={arcPath(START,valDeg)} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" style={{filter:`drop-shadow(0 0 3px ${color}88)`}}/>}
          <circle cx={Cx} cy={Cx} r={knobR+2} fill="#161616" stroke="#2a2a2a" strokeWidth="1"/>
          <circle cx={Cx} cy={Cx} r={knobR}   fill="url(#kg)" stroke="#333" strokeWidth="1"/>
          <circle cx={Cx+(knobR-3)*Math.cos(toRad(valDeg))} cy={Cx+(knobR-3)*Math.sin(toRad(valDeg))} r="2" fill={color} style={{filter:`drop-shadow(0 0 2px ${color})`}}/>
          <defs><radialGradient id="kg" cx="40%" cy="35%" r="65%"><stop offset="0%" stopColor="#2a2a2a"/><stop offset="100%" stopColor="#0d0d0d"/></radialGradient></defs>
        </svg>
      </div>
      <span className="text-xs uppercase tracking-widest leading-none font-bold" style={{color:color}}>{label}</span>
      {editing ? (
        <input ref={inputRef} className="w-10 text-center text-xs font-mono rounded px-1 py-0.5 border outline-none"
          style={{background:'#0a0a0a',borderColor:color,color}}
          value={inputStr} onChange={e=>setInputStr(e.target.value)}
          onBlur={commitEdit} onKeyDown={e=>{if(e.key==='Enter')commitEdit();if(e.key==='Escape')setEditing(false);}}/>
      ) : (
        <button onDoubleClick={openEdit} className="text-xs font-mono px-1.5 py-0.5 rounded border border-transparent hover:border-current transition-colors" style={{color}}>{value}</button>
      )}
    </div>
  );
}, (prev, next) => {
  return prev.value === next.value && prev.color === next.color && prev.size === next.size && prev.label === next.label;
});

const FIRMWARE='V1.8.0', DEVICE='Valeton GP-200JR', GUITAR='Schecter Sunset-6 Extreme';
function buildBackupJSON(p) { return JSON.stringify({_meta:{app:'TONE CLOUD GP-200JR Edition',device:DEVICE,firmware:FIRMWARE,guitar:GUITAR,exported:new Date().toISOString(),total:p.length},presets:p},null,2); }
function buildPresetJSON(p) { return JSON.stringify({_meta:{device:DEVICE,firmware:FIRMWARE,exported:new Date().toISOString()},preset:p},null,2); }
function buildReadableText(presets) {
  const SEP='═'.repeat(54), sep2='─'.repeat(54), date=new Date().toLocaleString('ko-KR');
  const lines=[SEP,'  TONE CLOUD GP-200JR  —  PRESET BACKUP',`  Device   : ${DEVICE}  (${FIRMWARE})`,`  Guitar   : ${GUITAR}`,`  Exported : ${date}`,`  Presets  : ${presets.length} patches`,SEP,''];
  presets.forEach((p,idx) => {
    const stars='★'.repeat(p.rating)+'☆'.repeat(5-p.rating);
    lines.push(`PATCH ${String(idx+1).padStart(2,'0')}  ${p.name}${p.isAI?'  [AI]':''}`);
    lines.push(`  Artist  : ${p.artist}${p.song?`  /  "${p.song}"`:''}`);
    lines.push(`  Pickup  : ${p.pickup}   Rating: ${stars}`);
    lines.push(`  Tags    : ${p.tags.map(t=>`#${t}`).join('  ')}`);
    lines.push(sep2); lines.push('  SIGNAL CHAIN:');
    p.chain.forEach((b,bi) => {
      const label=FX_LABEL[b.cat]??b.cat, status=b.active?'ON ':'OFF';
      const paramStr=Object.entries(b.params).map(([k,v])=>`${k.toUpperCase()}:${String(v).padStart(3)}`).join('  ');
      lines.push(`  [${bi+1}] [${status}] ${label.padEnd(12)} ${b.model.padEnd(18)} ${paramStr}`);
    });
    lines.push('');
  });
  lines.push(SEP,'  END OF BACKUP FILE',SEP);
  return lines.join('\n');
}
function triggerDownload(content, filename, mime='application/json') {
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([content],{type:mime})),download:filename});
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
}

const GAIN_LEVELS=['Clean','Light Crunch','Crunch','High Gain','Metal'];
const BRIGHT_LEVELS=['Dark','Warm','Neutral','Bright','Glassy'];
const SPACE_LEVELS=['Dry','Subtle','Moderate','Wet','Ambient'];
const GENRE_LIST=['J-Pop','J-Rock','Blues','Metal','Funk','Jazz','Pop','Punk','Country','R&B'];
const FX_TOGGLES=[{id:'comp',label:'Compressor',cat:'COMP'},{id:'chorus',label:'Chorus',cat:'CHO'},{id:'flanger',label:'Flanger',cat:'FLG'},{id:'phaser',label:'Phaser',cat:'PHS'},{id:'delay',label:'Delay',cat:'DLY'},{id:'reverb',label:'Reverb',cat:'RVB'}];
const DELAY_TYPES=['BBD Delay S','Tape Delay S','Digital Delay S','Slapback','Ping Pong','Pure'];
const REVERB_TYPES=['Room','Hall','Plate','Spring','Shimmer','Sweet Space'];

function wizardGenerate({ artist, song, genres, gainIdx, brightIdx, spaceIdx, fxOn, delayModel, reverbModel, useCab = true }) {
  const id=`wiz-${Date.now()}`, chain=[];
  if (gainIdx>=2||fxOn.includes('ns')) chain.push({cat:'NS',model:'Gate 1',active:true,params:{Threshold:26+gainIdx*5,Release:38}});
  if (fxOn.includes('comp')||gainIdx<=1) chain.push({cat:'COMP',model:gainIdx===0?'COMP4':'COMP',active:true,params:{Attack:22+gainIdx*4,Release:44,Ratio:28+gainIdx*5,Level:68}});
  const isBlues=genres.includes('Blues')||genres.includes('Jazz'), isJPop=genres.includes('J-Pop')||genres.includes('Pop'), isMetal=genres.includes('Metal')||genres.includes('Punk');
  if (gainIdx===1) chain.push({cat:'OD',model:isBlues?'Blues Master':isJPop?'TaiChi OD':'Green OD',active:true,params:{Drive:32+brightIdx*5,Tone:44+brightIdx*7,Level:64}});
  else if (gainIdx===2) chain.push({cat:'OD',model:isBlues?'Blues OD':isMetal?'Revolt':'Force',active:true,params:{Drive:52+brightIdx*3,Tone:50+brightIdx*5,Level:68}});
  else if (gainIdx>=3) chain.push({cat:'OD',model:isMetal?'Swarm':'Precise OD',active:true,params:{Drive:58,Tone:50+brightIdx*4,Level:72}});
  const AMP_TABLE=[isJPop?'J-120 CL':isBlues?'Tweedy':'Dark Twin',isJPop?'Foxy 30N':isBlues?'UK 45':'Match OD',isBlues?'UK SLP':isMetal?'Flagman 1':'UK 800',isMetal?'Mess DualV':'EV 51',isMetal?'Mess DualM':'Eagle 120'];
  const treble=Math.max(25,Math.min(85,[55,58,54,51,48][gainIdx]+(brightIdx-2)*9));
  const mid=Math.max(25,Math.min(80,[54,55,58,54,46][gainIdx]+(brightIdx-2)*3));
  const bass=Math.max(25,Math.min(80,[52,48,48,52,56][gainIdx]-(brightIdx-2)*4));
  chain.push({cat:'AMP',model:AMP_TABLE[gainIdx],active:true,params:{Gain:[16,34,58,74,88][gainIdx],Bass:bass,Mid:mid,Treble:treble,Vol:70,Presence:Math.max(30,Math.min(80,50+(brightIdx-2)*7))}});
  
  if (useCab) {
    let cabModel = '4x12 V30';
    if (gainIdx === 0) cabModel = isJPop ? '2x12 Vox' : '2x12 Fender';
    else if (gainIdx === 1) cabModel = isBlues ? '4x12 GRN' : '2x12 Vox';
    else if (gainIdx === 2) cabModel = '4x12 GRN';
    else cabModel = isMetal ? '4x12 Mesa' : '4x12 V30';
    chain.push({cat:'CAB',model:cabModel,active:true,params:{HiCut:Math.max(40,58-gainIdx*2),LoCut:Math.min(60,34+gainIdx*2),Mix:100}});
  }

  if (gainIdx>=3||(gainIdx>=2&&isMetal)) chain.push({cat:'EQ',model:'Mess EQ',active:true,params:{Lo:52,LMid:40+(brightIdx-2)*3,Mid:42+(brightIdx-2)*4,HMid:55,Hi:54+(brightIdx-2)*4}});
  if (fxOn.includes('chorus')) chain.push({cat:'CHO',model:brightIdx>=3?'G-Chorus':'A-Chorus',active:true,params:{Rate:28+spaceIdx*5,Depth:gainIdx<=1?42:25,Mix:32+spaceIdx*4}});
  if (fxOn.includes('flanger')) chain.push({cat:'FLG',model:'Jet',active:true,params:{Rate:30,Depth:45,Feedback:38,Mix:32}});
  if (fxOn.includes('phaser')) chain.push({cat:'PHS',model:'O-Phase',active:true,params:{Rate:35,Depth:50,Mix:38}});
  if (fxOn.includes('delay')||spaceIdx>=2) chain.push({cat:'DLY',model:delayModel??DELAY_TYPES[Math.min(spaceIdx,5)],active:true,params:{Time:32+spaceIdx*13,Feedback:Math.min(55,16+spaceIdx*9),Mix:Math.min(44,10+spaceIdx*8)}});
  if (fxOn.includes('reverb')||spaceIdx>=1) chain.push({cat:'RVB',model:reverbModel??(gainIdx>=3?'Room':REVERB_TYPES[Math.min(spaceIdx+1,5)]),active:true,params:{Decay:Math.min(72,25+spaceIdx*13),Mix:Math.min(52,10+spaceIdx*9)}});
  const gainName=GAIN_LEVELS[gainIdx];
  const name=artist&&song?`Wizard: ${artist} — ${song}`:artist?`Wizard: ${artist} ${gainName}`:`Wizard: ${gainName} / ${BRIGHT_LEVELS[brightIdx]}`;
  // 드라이브 페달은 MODEL_DB 기준 카테고리로 표시 (Revolt 등은 OD가 아니라 DST)
  return {id,name,artist:artist||'Custom',song:song||'Wizard',tags:[gainName.toLowerCase().replace(' ','-'),...genres.slice(0,3)],pickup:['Neck (1st)','Neck Split (2nd)','Mid (3rd)','Bridge Split (4th)','Bridge HB'][Math.min(gainIdx+1,4)],rating:0,isAI:true,chain:chain.map((b,i)=>({...b,cat:b.cat==='OD'?(modelCategory(b.model)??'OD'):b.cat,id:`${id}-${i}`}))};
}

// MODEL_DB 에서 모델이 속한 카테고리 찾기 (예: 'Revolt' → 'DST')
function modelCategory(name) {
  for (const [cat, entry] of Object.entries(MODEL_DB)) {
    if (entry.models?.some(m => m.name === name || m.id === name)) return cat;
  }
  return null;
}

// 픽업 표기를 Schecter 5-way 셀렉터 표기('Position N: ...')로 통일
function normalizePickup(pk) {
  const p = String(pk).toLowerCase();
  if (p.includes('bridge hb') || p.includes('position 1') || p.includes('full bridge')) return 'Position 1: Full Bridge';
  if (p.includes('bridge split') || p.includes('4th') || p.includes('position 2') || p.includes('inner coils')) return 'Position 2: Inner Coils';
  if (p.includes('mid') || p.includes('3rd') || p.includes('position 3') || p.includes('both humbuckers')) return 'Position 3: Both Humbuckers';
  if (p.includes('neck split') || p.includes('2nd') || p.includes('position 4') || p.includes('outer coils')) return 'Position 4: Outer Coils';
  if (p.includes('neck (1st)') || p.includes('1st') || p.includes('position 5') || p.includes('full neck')) return 'Position 5: Full Neck';
  return pk;
}

// GenreMapper 룰에 적힌 장비(앰프·드라이브·캐비닛·노이즈게이트·픽업)를 체인에 그대로 반영
function applyRuleHardware(preset, rule) {
  let chain = preset.chain.map(b => ({ ...b, params: { ...b.params } }));

  const amp = chain.find(b => b.cat === 'AMP');
  if (amp && rule.amp) { amp.model = rule.amp; amp.params = { ...rule.ampParams }; }

  chain = chain.filter(b => b.cat !== 'OD' && b.cat !== 'DST');
  if (rule.od) {
    const ampIdx = chain.findIndex(b => b.cat === 'AMP');
    chain.splice(ampIdx === -1 ? 0 : ampIdx, 0,
      { cat: modelCategory(rule.od) ?? 'OD', model: rule.od, active: true, params: { ...rule.odParams } });
  }

  const cab = chain.find(b => b.cat === 'CAB');
  if (cab && rule.cab) cab.model = rule.cab;

  chain = chain.filter(b => b.cat !== 'NS');
  if (rule.hasNS) chain.unshift({ cat: 'NS', model: 'Gate 1', active: true, params: { Threshold: rule.nsThreshold, Release: 38 } });

  return { ...preset, pickup: normalizePickup(rule.pickup), chain: chain.map((b, i) => ({ ...b, id: `${preset.id}-${i}` })) };
}

function toneValidator(preset, genres) {
  if (!preset) return preset;

  // Standardize genres to an array of lowercase strings
  let genreArray = [];
  if (Array.isArray(genres)) {
    genreArray = genres.map(g => String(g).toLowerCase());
  } else if (typeof genres === 'string') {
    genreArray = genres.split(/[\s,]+/).map(g => g.toLowerCase());
  }
  
  // 1. Detect genre categories
  const isMetal = genreArray.some(g => g.includes('metal') || g.includes('djent') || g.includes('heavy'));
  const isRock = genreArray.some(g => (g.includes('rock') || g.includes('classic') || g.includes('modern')) && !g.includes('j-rock') && !g.includes('j-pop'));
  const isJRockPop = genreArray.some(g => g.includes('j-rock') || g.includes('j-pop') || g.includes('japanese') || g.includes('pop'));

  // Find AMP block in signal chain
  const ampBlock = preset.chain.find(b => b.cat === 'AMP');

  // Standardize pickup first
  preset.pickup = normalizePickup(preset.pickup);

  if (isMetal) {
    if (ampBlock) {
      if (ampBlock.params.Gain < 75) ampBlock.params.Gain = 75;
      if (ampBlock.params.Treble < 70) ampBlock.params.Treble = 70;
      ampBlock.params.Presence = 72; // Lock Presence to 72
      ampBlock.params.Mid = 35; // Scoop Middle to 35
    }
    preset.pickup = 'Position 1: Full Bridge';
    
    // Automatically turn ON the EQ module to ensure directness
    const eqBlock = preset.chain.find(b => b.cat === 'EQ');
    if (eqBlock) {
      eqBlock.active = true;
    }
  } else if (isRock) {
    if (ampBlock) {
      if (ampBlock.params.Gain < 50 || ampBlock.params.Gain > 70) {
        ampBlock.params.Gain = 60;
      }
      if (ampBlock.params.Mid < 60) ampBlock.params.Mid = 70;
    }
  } else if (isJRockPop) {
    if (ampBlock) {
      if (ampBlock.params.Gain > 50) ampBlock.params.Gain = 40;
      if (ampBlock.params.Treble < 65) ampBlock.params.Treble = 65;
    }
    
    // Switch to Position 2: Inner Coils
    if (preset.pickup === 'Position 1: Full Bridge' || preset.pickup === 'Position 5: Full Neck') {
      preset.pickup = 'Position 2: Inner Coils';
    }
    
    // Volume compensation: Switch to Position 2 outputs lower volume, compensate with +12% volume on AMP (max 95)
    if (preset.pickup === 'Position 2: Inner Coils' && ampBlock && ampBlock.params.Vol !== undefined) {
      ampBlock.params.Vol = Math.min(95, Math.round(ampBlock.params.Vol * 1.12));
    }
    
    // Delay and Reverb Mix parameter +15% but capped at 32 (only for J-Rock)
    const isJRock = genreArray.some(g => g.includes('j-rock') || g.includes('jrock'));
    if (isJRock) {
      preset.chain.forEach(b => {
        if ((b.cat === 'DLY' || b.cat === 'RVB') && b.params && b.params.Mix !== undefined) {
          b.params.Mix = Math.min(32, Math.round(b.params.Mix * 1.15));
        }
      });
    }
  }

  return preset;
}

  if (prevProps.activeId !== nextProps.activeId) return false;

  if (prevProps.presets.length !== nextProps.presets.length) return false;
  
  // Custom comparison to check metadata changes only
  for (let i = 0; i < prevProps.presets.length; i++) {
    const p1 = prevProps.presets[i];
    const p2 = nextProps.presets[i];
    if (p1.id !== p2.id || p1.name !== p2.name || p1.artist !== p2.artist || p1.rating !== p2.rating || p1.isAI !== p2.isAI) {
      return false;

      }
    }
  }
  return true;
});

            <div className="flex items-center gap-2 flex-shrink-0">
              <Sparkles size={13} className="text-blue-500"/>
              <span className="text-xs text-gray-400 uppercase tracking-widest hidden sm:block">AI TONE</span>
            </div>
            <input className="flex-1 bg-[#161616] border border-[#383838] rounded-xl px-4 py-2.5 text-xs text-gray-300 placeholder-gray-500 focus:outline-none focus:border-blue-600 transition-colors"
              placeholder="아티스트 입력 (HigeDan / Vaundy / YOASOBI / Metallica…)"
              value={aiQuery} onChange={e=>{setAiQuery(e.target.value);setAiError(null);}} onKeyDown={e=>e.key==='Enter'&&!aiLoading&&handleGenerate()}/>
            <button onClick={handleGenerate} disabled={aiLoading||!aiQuery.trim()}
              className="flex items-center gap-2 bg-white hover:bg-blue-400 disabled:opacity-30 text-black px-4 py-2.5 rounded-xl text-xs font-black transition-colors flex-shrink-0">
              {aiLoading?<div className="w-3.5 h-3.5 border-2 border-black/30 border-t-black rounded-full animate-spin"/>:<Zap size={13} fill="currentColor"/>}
              ANALYZE
            </button>
            <div className="h-7 w-px bg-[#1e1e1e] flex-shrink-0"/>
            <button onClick={()=>setShowWizard(true)}
              className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-black flex-shrink-0 transition-all hover:scale-105"
              style={{background:'linear-gradient(135deg,#6d28d9,#4c1d95)',color:'white',boxShadow:'0 0 12px #7c3aed44'}}>
              <span className="text-sm leading-none">🎛</span> CUSTOM BUILDER
            </button>
          </div>
        </>
      )}

      <div className="flex items-center justify-between pt-3 border-t border-[#1f1f1f] text-xs">
        <div className="flex items-center gap-2 text-gray-500">
          <span className="w-2 h-2 rounded-full bg-blue-500/85"/>
          <span>Guitar Model: <strong>Schecter Sunset-6 Extreme</strong> (Fixed)</span>
        </div>
        <div className="flex items-center gap-3">
          <span className="text-[11px] text-gray-400 font-bold uppercase tracking-widest">OUTPUT MODE</span>
          <div className="flex bg-[#161616] p-0.5 rounded-lg border border-[#2a2a2a]">
            <button onClick={()=>setUseCab(true)} className={`px-3 py-1.5 rounded-md text-[10px] font-bold transition-all ${useCab?'bg-blue-600 text-white shadow-sm':'text-gray-500 hover:text-gray-300'}`}>Direct / Mixer (CAB ON)</button>
            <button onClick={()=>setUseCab(false)} className={`px-3 py-1.5 rounded-md text-[10px] font-bold transition-all ${!useCab?'bg-blue-600 text-white shadow-sm':'text-gray-500 hover:text-gray-300'}`}>Amp Return (CAB OFF)</button>
          </div>
        </div>
      </div>
    </footer>
  );
}, (prev, next) => {
  return prev.aiPreview === next.aiPreview &&
         prev.aiQuery === next.aiQuery &&
         prev.aiLoading === next.aiLoading &&
         prev.aiError === next.aiError &&
         prev.aiNote === next.aiNote &&
         prev.useCab === next.useCab;
});

function ToneCloudApp() {
  const [presets,setPresets]=useState(INITIAL_PRESETS);
  const [activeId,setActiveId]=useState('1');
  const [selBlockId,setSelBlockId]=useState(null);
  const [search,setSearch]=useState('');
  const [activeTags,setActiveTags]=useState([]);
  const [aiQuery,setAiQuery]=useState('');
  const [aiLoading,setAiLoading]=useState(false);
  const [aiPreview,setAiPreview]=useState(null);
  const [useCab,setUseCab]=useState(true);
  const [showBrowser,setShowBrowser]=useState(false);
  const [showExport,setShowExport]=useState(false);
  const [showWizard,setShowWizard]=useState(false);
  const [aiError,setAiError]=useState(null);
  const [aiNote,setAiNote]=useState(null);

  // 블록 RESET 용 원본 체인 (기본 프리셋 + 이후 저장되는 AI/위저드 프리셋)
  const originalsRef = useRef(new Map(INITIAL_PRESETS.map(p => [p.id, p.chain])));
  const rememberOriginal = p => originalsRef.current.set(p.id, p.chain.map(b => ({ ...b, params: { ...b.params } })));

  // OUTPUT MODE 는 화면 표시만 바꾼다 — 프리셋 데이터는 건드리지 않음
  const cabForcedOff = b => !useCab && b.cat === 'CAB';

  const active   = presets.find(p=>p.id===activeId)??presets[0];
  const selBlock = active?.chain.find(b=>b.id===selBlockId)??null;
  const allTags  = [...new Set(presets.flatMap(p=>p.tags))];
  const filtered = presets.filter(p => {
    const lq=search.toLowerCase();
    return (!lq||p.name.toLowerCase().includes(lq)||p.artist.toLowerCase().includes(lq))
        && (activeTags.length===0||activeTags.every(t=>p.tags.includes(t)));
  });

  const updateParam = useCallback((blockId,key,value) => {
    setPresets(prev=>prev.map(p=>p.id!==activeId?p:{...p,chain:p.chain.map(b=>b.id!==blockId?b:{...b,params:{...b.params,[key]:value}})}));
  }, [activeId]);
  const toggleBlockActive = useCallback((blockId) => {
    setPresets(prev=>prev.map(p=>p.id!==activeId?p:{...p,chain:p.chain.map(b=>b.id!==blockId?b:{...b,active:!b.active})}));
  }, [activeId]);
  const resetBlockParams = useCallback((blockId) => {
    const src=originalsRef.current.get(activeId)?.find(b=>b.id===blockId);
    if (!src) return;
    setPresets(prev=>prev.map(p=>p.id!==activeId?p:{...p,chain:p.chain.map(b=>b.id!==blockId?b:{...b,params:{...src.params}})}));
  }, [activeId]);

  const selColor   = selBlock?(FX_COLOR[selBlock.cat]??FX_COLOR.EQ):null;
  const selDbEntry = selBlock?MODEL_DB[selBlock.cat]?.models.find(m=>m.name===selBlock.model||m.id===selBlock.model):null;
  const toggleTag  = tag => setActiveTags(prev=>prev.includes(tag)?prev.filter(t=>t!==tag):[...prev,tag]);
  const handleGenerate = async () => {
    const query = aiQuery.trim();
    if (!query) return;
    setAiLoading(true); setAiError(null);
    try {
      // 1. MusicBrainz API로 아티스트 분석하여 진짜 장르/태그 가져오기
      const res = await fetch(`https://musicbrainz.org/ws/2/artist/?query=${encodeURIComponent(query)}&fmt=json&limit=5`);
      if (!res.ok) {
        setAiError(res.status === 503
          ? 'MusicBrainz 요청이 너무 잦아요. 1~2초 뒤에 다시 시도해주세요.'
          : `MusicBrainz 응답 오류(${res.status}). 잠시 후 다시 시도해주세요.`);
        return;
      }
      const data = await res.json();

      // 검색 점수 90 미만은 엉뚱한 아티스트일 가능성이 커서 쓰지 않음.
      // 입력어 자체가 장르(예: metal, j-pop)면 이름이 정확히 같은 아티스트만 인정
      // (안 그러면 'metal' 검색에 "Various Artists" 같은 결과가 걸림)
      const lq = query.toLowerCase();
      const queryIsGenre = window.GenreMapper.mapGenreToHardware([lq]).matched;
      const nameIs = a => [a.name, a['sort-name'], ...(a.aliases || []).map(x => x.name)].some(n => n?.toLowerCase() === lq);
      const artist = (data.artists || []).find(a => a.score >= 90 && (!queryIsGenre || nameIs(a))) ?? null;
      // 득표수(count) 높은 태그가 그 아티스트의 대표 장르
      const tags = (artist?.tags || []).slice().sort((a, b) => b.count - a.count).map(t => t.name.toLowerCase());

      // 검색창에 직접 장르를 쳤을 경우를 대비해 원본 검색어도 보조 태그로 추가 (우선순위는 가장 낮음)
      const combinedTags = [...tags, lq, ...lq.split(/[\s,]+/)];

      // 2. genreMapper 룰셋 매핑
      const { rule, matched, matchedTag } = window.GenreMapper.mapGenreToHardware(combinedTags);
      if (!artist && !matched) {
        setAiError(`'${query}' 아티스트나 장르를 찾지 못했어요. 영문 표기(예: ONE OK ROCK) 또는 장르(예: metal, j-pop)로 입력해보세요.`);
        return;
      }
      const params = window.GenreMapper.ruleToWizardParams(rule);

      // 3. 실제 파라미터를 기반으로 AI 톤 자동 생성
      const base = wizardGenerate({
        artist: artist?.name || query,
        song: matched ? `Style: ${rule.label}` : 'AI Generated (Fallback)',
        genres: params.genres,
        gainIdx: params.gainIdx,
        brightIdx: params.brightIdx,
        spaceIdx: params.spaceIdx,
        fxOn: params.fxOn,
        delayModel: null,
        reverbModel: null,
        useCab: true // CAB 은 항상 넣어두고, 앰프 리턴 모드에선 화면에서 꺼진 것으로 표시
      });

      // 3. 룰에 정의된 장비를 최종값으로 반영 (toneValidator 로 다시 덮어쓰지 않음)
      const preset = applyRuleHardware({ ...base, id: `ai-${Date.now()}`, isAI: true }, rule);
      setAiNote(!artist
        ? `아티스트를 찾지 못해 입력어 "${matchedTag}"로 장르 추정 → ${rule.label}`
        : matched
          ? `${artist.name} · MusicBrainz 태그 "${matchedTag}" → ${rule.label}`
          : `${artist.name} · 장르 태그 없음 → 기본 톤(${rule.label})`);
      setAiPreview(preset);
    } catch (e) {
      console.error(e);
      setAiError('네트워크 오류로 MusicBrainz에 연결하지 못했어요. 인터넷 연결을 확인해주세요.');
    } finally {
      setAiLoading(false);
    }
  };
  const saveAI = () => {
    if (!aiPreview) return;
    rememberOriginal(aiPreview);
    setPresets(prev=>[aiPreview,...prev]);
    setActiveId(aiPreview.id); setSelBlockId(null); setAiPreview(null); setAiQuery('');
  };
  const addCabBlock = () => {
    setPresets(prev => prev.map(p => {
      if (p.id !== activeId || p.chain.some(b => b.cat === 'CAB')) return p;
      const ampIdx = p.chain.findIndex(b => b.cat === 'AMP');
      const cab = { id: `${p.id}-cab-${Date.now()}`, cat: 'CAB', model: '4x12 V30', active: true, params: { HiCut: 50, LoCut: 40, Mix: 100 } };
      const chain = [...p.chain];
      chain.splice(ampIdx === -1 ? chain.length : ampIdx + 1, 0, cab);
      return { ...p, chain };
    }));
  };
  const hasCab = active.chain.some(b => b.cat === 'CAB');

  return (
    <div className="min-h-screen bg-[#0a0a0a] text-gray-200 flex flex-col" style={{fontFamily:"'Courier New',Courier,monospace"}}>
      {showBrowser && <ModelBrowser onClose={()=>setShowBrowser(false)}/>}
      {showExport  && <ExportModal presets={presets} active={active} onClose={()=>setShowExport(false)}/>}
      {showWizard  && <ToneWizardModal onClose={()=>setShowWizard(false)} onSave={(preset)=>{rememberOriginal(preset);setPresets(prev=>[preset,...prev]);setActiveId(preset.id);setSelBlockId(null);}}/>}

      <SlideInPanel block={selBlock} dbEntry={selDbEntry} color={selColor??{border:'#3b82f6',bg:'#0a1628',text:'#60a5fa'}}
        note={selBlock&&cabForcedOff(selBlock)?'앰프 리턴 모드라 이 CAB은 꺼진 것으로 표시돼요. 실제 기기에서도 CAB을 OFF 하세요.':null}
        onClose={()=>setSelBlockId(null)} onParamChange={(key,val)=>updateParam(selBlock.id,key,val)}
        onToggleActive={()=>toggleBlockActive(selBlock.id)} onReset={()=>resetBlockParams(selBlock.id)}/>

      <ToneCloudHeader presetsLength={presets.length} setShowBrowser={setShowBrowser} setShowExport={setShowExport} />

      <div className="flex flex-1 overflow-hidden">
        <PresetSidebar 
          presets={presets}
          activeId={activeId}
          setActiveId={setActiveId}
          setSelBlockId={setSelBlockId}
          search={search}
          setSearch={setSearch}
          activeTags={activeTags}
          toggleTag={toggleTag}
          allTags={allTags}
        />

        <main className="flex-1 flex flex-col overflow-hidden">
          <div className="px-6 py-4 border-b border-[#2a2a2a] flex-shrink-0">
            <div className="flex items-start justify-between">
              <div>
                <div className="flex items-center gap-2">
                  {active.isAI&&<Sparkles size={13} className="text-blue-400"/>}
                  <h2 className="text-xl font-black text-white tracking-tight">{active.name}</h2>
                </div>
                <div className="flex flex-wrap items-center gap-3 mt-1.5">
                  <span className="text-[13px] text-gray-500 flex items-center gap-1"><Music size={10}/>{active.artist}</span>
                  {active.song&&<span className="text-[13px] text-gray-400">"{active.song}"</span>}
                  <span className="text-xs bg-blue-900/25 text-blue-400 px-2 py-0.5 rounded border border-blue-500/20 uppercase tracking-wider">{active.pickup}</span>
                </div>
              </div>
              <div className="flex items-center gap-0.5">
                {[1,2,3,4,5].map(s=><Star key={s} size={11} className={s<=active.rating?'text-yellow-500 fill-yellow-500':'text-gray-500'}/>)}
              </div>
            </div>
            <div className="flex flex-wrap gap-1 mt-2.5">
              {active.tags.map(tag=><span key={tag} className="text-xs px-1.5 py-0.5 rounded-full border border-[#1e1e1e] text-gray-400">#{tag}</span>)}
            </div>
          </div>

          <div className="px-6 py-4 border-b border-[#2a2a2a] flex-shrink-0">
            <div className="flex items-center gap-2 mb-3">
              <Activity size={10} className="text-gray-400"/>
              <span className="text-xs text-gray-400 uppercase tracking-widest">SIGNAL CHAIN — VALETON GP-200JR</span>
            </div>
            <div className="flex items-center gap-1 overflow-x-auto pb-1">
              <div className="flex items-center gap-1 flex-shrink-0">
                <div className="min-w-[58px] p-2 rounded-xl border border-[#383838] bg-[#161616] text-center">
                  <Guitar size={14} className="text-gray-400 mx-auto mb-1"/>
                  <div className="text-sm text-gray-400 tracking-widest">GUITAR</div>
                </div>
                <ChevronRight size={10} className="text-gray-500"/>
              </div>
              {active.chain.map(block=>(
                <ChainBlock key={block.id} block={block} isSelected={selBlockId===block.id} forcedOff={cabForcedOff(block)}
                  onClick={()=>setSelBlockId(selBlockId===block.id?null:block.id)}/>
              ))}
              <div className="min-w-[58px] p-2 rounded-xl border border-[#383838] bg-[#161616] text-center flex-shrink-0">
                <div className="w-3.5 h-3.5 rounded-full bg-green-600 mx-auto mb-1 ring-2 ring-green-400/25"/>
                <div className="text-sm text-gray-400 tracking-widest">OUTPUT</div>
              </div>
            </div>
            {useCab && !hasCab && (
              <div className="mt-2.5 flex flex-wrap items-center gap-2 px-3 py-2 rounded-lg text-xs font-bold border bg-blue-900/15 border-blue-500/25 text-blue-300">
                <span>ℹ️ 이 프리셋에는 CAB 블록이 없어요. 헤드폰·인터페이스로 들으면 소리가 거칠 수 있어요.</span>
                <button onClick={addCabBlock} className="ml-auto px-2.5 py-1 rounded-md border border-blue-500/50 text-blue-300 hover:bg-blue-600 hover:text-white transition-colors">+ CAB 추가</button>
              </div>
            )}
            {!useCab && hasCab && (
              <div className="mt-2.5 flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-bold border bg-orange-900/15 border-orange-500/30 text-orange-300">
                ⚠️ 앰프 리턴 모드: CAB 블록은 꺼진 것으로 표시돼요. 실제 GP-200JR에서도 CAB을 OFF 하세요.
              </div>
            )}
          </div>

          <div className="flex-1 flex flex-col items-center justify-center text-center gap-3 px-6">
            <div className="w-16 h-16 rounded-2xl border border-[#383838] flex items-center justify-center mb-1" style={{background:'#0d0d0d'}}>
              <Sliders size={28} className="text-gray-500"/>
            </div>
            <p className="text-gray-300 text-sm font-bold">시그널 체인 블록을 클릭하세요</p>
            <p className="text-gray-400 text-xs leading-relaxed max-w-xs">우측에서 GP-200JR 스타일 노브 패널이 슬라이드 인 됩니다.<br/>드래그·더블클릭·+/- 버튼으로 값을 조절할 수 있습니다.</p>
            <button onClick={()=>setShowBrowser(true)} className="mt-2 flex items-center gap-1.5 text-[13px] text-blue-500 hover:text-blue-400 border border-blue-500/20 hover:border-blue-500/40 px-3 py-1.5 rounded-lg transition-colors"><BookOpen size={11}/> GP-200JR 모델 브라우저 열기</button>
            <div className="mt-6 w-full max-w-md">
              <div className="text-xs text-gray-500 uppercase tracking-widest mb-2">ACTIVE CHAIN</div>
              <div className="flex flex-wrap justify-center gap-1.5">
                {active.chain.map(b=>{const c=FX_COLOR[b.cat]??FX_COLOR.EQ;return(
                  <button key={b.id} onClick={()=>setSelBlockId(b.id)} className="px-2.5 py-1.5 rounded-lg border text-xs font-bold uppercase tracking-wider transition-all hover:scale-105"
                    style={{background:c.bg,borderColor:`${c.border}40`,color:b.active&&!cabForcedOff(b)?c.text:c.text+'40'}}>{b.model}</button>
                );})}
              </div>
            </div>
          </div>
        </main>
      </div>

      <ToneCloudFooter 
        aiPreview={aiPreview}
        aiQuery={aiQuery}
        setAiQuery={setAiQuery}
        handleGenerate={handleGenerate}
        aiLoading={aiLoading}
        setShowWizard={setShowWizard}
        useCab={useCab}
        setUseCab={setUseCab}
        saveAI={saveAI}
        setAiPreview={setAiPreview}
        aiError={aiError}
        setAiError={setAiError}
        aiNote={aiNote}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ToneCloudApp />);
  </script>
</body>
</html>
