function useEscape(onClose, enabled = true) {
  const ref = useRef(onClose); ref.current = onClose;
  useEffect(() => {
    if (!enabled) return;
    const onKey = e => e.key === 'Escape' && ref.current();
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [enabled]);
}

// ── 실제 기기 파라미터 표(gp200jrModels.js, 펌웨어 V1.7.0) 연결 ─────────────────
// 모든 블록은 normalizeBlock 을 거쳐 "기기 화면과 같은 파라미터 이름·개수·순서"로 맞춰진다.
// schema 2 = 이 표에 맞춘 프리셋. 그 이전에 저장된 프리셋은 한 번만 옛 이름/값을 변환(migrate)한다.
const PARAM_SCHEMA = 3;   // 3: 캐비닛 Low/Hi Cut 을 Hz 로 (사용자 확인 2026-10)
const GP = window.GP200JR ?? null;
// 기기에 없는 옛 모델 이름 → 가장 가까운 실제 모델
const MODEL_RENAMES = {
  CAB: { '4x12 GRN':'UK GRN 2', '4x12 V30':'UK LD', '4x12 Mesa':'Mess', '2x12 Vox':'FOXY 2', '2x12 Fender':'Dark Twin',
         '1x12 Fender':'Dark LUX', '4x12 Fender':'Bellman 2', '4x12 MD':'UK MD', '4x12 Orange':'Juice', '4x12 Soldano':'Solo' },
  // V1.8.0 에 있는 A-Chorus·Gate 3 은 그대로 두고, 옛 'Tube' 는 V1.8.0 의 'Tube OD'
  OD:  { 'Tube':'Tube OD' },
};
// 옛 파라미터 이름 → 실제 이름 (실제 이름이 없을 때만 차례로 찾아 씀)
const PARAM_ALIASES = {
  Volume:['Vol','Level','Output'], Middle:['Mid'], Gain:['Drive','Fuzz'], Sustain:['Ratio','Gain'], Fuzz:['Gain','Sustain','Drive'],
  Filter:['Tone'], 'Tone Cut':['Tone'], 'Hi Cut':['HiCut','High Cut'], 'Low Cut':['LoCut','Lo Cut'], 'High Damp':['HiCut','Hi Damp'],
  'Pre Delay':['Pre'], 'Band 1':['Lo'], 'Band 2':['LMid'], 'Band 3':['Mid'], 'Band 4':['HMid'], 'Band 5':['Hi'],
  'Oct 1':['Low Oct'], 'Oct 2':['High Oct'],
};

function modelSpec(cat, model) {
  if (!GP) return null;
  return GP.find(GP.moduleOf[cat], model)
    ?? GP.find('DST', model) ?? GP.find('PRE', model)   // 부스트·OD 는 PRE/DST 양쪽에 있음
    ?? Object.values(GP.models).map(m => m[model]).find(Boolean) ?? null;
}
const paramSpec = (block, name) => modelSpec(block.cat, block.model)?.params.find(p => p.n === name) ?? null;

function paramDefault(p) {
  if (p.t === 'switch') return false;
  if (p.t === 'select') return p.o[0];
  if (p.unit === 'ms') return 400;
  if (p.n === 'Low Cut' || p.n === 'Lo Cut') return 0;
  if (p.n === 'Latch' || p.n === 'Cut') return 0;   // Broken Delay: 0 = 글리치 없음
  if (p.offAtZero) return 0;                                            // CAB Hi Cut: 0Hz = 자르지 않음
  if (p.n === 'Hi Cut' || p.n === 'High Cut') return p.max ?? 100;
  return Math.round(((p.min ?? 0) + (p.max ?? 100)) / 2);
}
// 옛 0~100 캐비닛 컷 값 → Hz. Low Cut 은 ×2 (34 → 68Hz, 저음 정리 정도), Hi Cut 은 '자르지 않음'
const legacyCutToHz = (p, v) => (p.offAtZero ? 0 : Math.round(v * 2));
function coerceParam(p, v, migrate) {
  if (p.t === 'switch') return v === undefined ? paramDefault(p) : !!v;
  if (p.t === 'select') return p.o.includes(String(v)) ? String(v) : paramDefault(p);
  if (typeof v !== 'number' || isNaN(v)) return paramDefault(p);
  if (migrate && v >= 0 && v <= 100) {   // 옛 값은 모두 0~100 기준
    if (p.unit === 'dB') v = Math.round((v - 50) / 50 * p.max);   // 50 = 0dB
    else if (p.unit === 'ms') v = v * 10;                         // 45 → 450ms
    else if (p.unit === 'Hz' && /Cut$/.test(p.n)) v = legacyCutToHz(p, v);
  }
  return Math.max(p.min ?? 0, Math.min(p.max ?? 100, Math.round(v)));
}
function normalizeBlock(b, migrate = false) {
  const model = migrate ? (MODEL_RENAMES[b.cat]?.[b.model] ?? b.model) : b.model;
  const spec = modelSpec(b.cat, model);
  if (!spec) return { ...b, model };   // 표에 없는 모델은 손대지 않음
  const src = b.params ?? {};
  const params = {};
  for (const p of spec.params) {
    let v = src[p.n];
    if (v === undefined && migrate) v = (PARAM_ALIASES[p.n] ?? []).map(a => src[a]).find(x => x !== undefined);
    params[p.n] = coerceParam(p, v, migrate);
  }
  return { ...b, model, params };
}
// 저장 형식 버전별 변환
//  1(없음) → 옛 이름·0~100 값 전부 변환 / 2 → 캐비닛 Low/Hi Cut 만 0~100 숫자로 남아 있어 Hz 로 변환
function normalizeChain(chain, fromSchema) {
  return chain.map(b => {
    const nb = normalizeBlock(b, fromSchema < 2);
    if (fromSchema !== 2 || nb.cat !== 'CAB') return nb;
    const params = { ...nb.params };
    for (const name of ['Low Cut', 'Hi Cut']) {
      const p = paramSpec(nb, name);
      if (p && typeof b.params?.[name] === 'number') params[name] = legacyCutToHz(p, b.params[name]);
    }
    return { ...nb, params };
  });
}
const normalizePreset = p => ({ ...p, schema: PARAM_SCHEMA, chain: normalizeChain(p.chain, p.schema ?? 1) });
// 저장 데이터(localStorage·클라우드) 정규화 — 옛 프리셋의 RESET 원본도 같은 규칙으로 변환
function normalizeSavedState({ presets, originals }) {
  const fromById = new Map(presets.map(p => [p.id, p.schema ?? 1]));
  return {
    presets: presets.map(normalizePreset),
    originals: Object.fromEntries(Object.entries(originals ?? {}).filter(([, c]) => Array.isArray(c))
      .map(([id, chain]) => [id, normalizeChain(chain, fromById.get(id) ?? PARAM_SCHEMA)])),
  };
}

// 앰프 Bright 스위치: 밝은 톤이면 ON + 고음이 과해지지 않게 Treble 을 조금 낮춤
function applyAmpBright(chain, bright) {
  return chain.map(b => {
    if (b.cat !== 'AMP' || !('Bright' in b.params)) return b;
    const params = { ...b.params, Bright: bright };
    if (bright && typeof params.Treble === 'number') params.Treble = Math.max(0, params.Treble - 8);
    return { ...b, params };
  });
}

// 값 표시: ON/OFF, 단위(ms, dB, cents …)
function fmtParamValue(p, v) {
  if (typeof v === 'boolean') return v ? 'ON' : 'OFF';
  if (!p?.unit) return String(v);
  if (p.offAtZero && v === 0) return '0Hz(OFF)';
  // 음수가 가능한 값만 + 기호 (EQ dB, 피치, Ring Mod Fine …)
  if ((p.min ?? 0) < 0) return `${v > 0 ? '+' : ''}${v}${p.unit === 'cents' ? '¢' : p.unit}`;
  return `${v}${p.unit}`;
}
const fmtBlockParams = b => Object.entries(b.params).map(([k, v]) => `${k} ${fmtParamValue(paramSpec(b, k), v)}`).join(' · ');

// 한 모듈에 2개 이상 들어간 블록 찾기 (실제 기기는 모듈당 1개만)
function moduleConflicts(chain) {
  const by = {};
  chain.forEach(b => { const m = modelSpec(b.cat, b.model)?.module; if (m && b.active) (by[m] ??= []).push(b.model); });
  return Object.entries(by).filter(([, list]) => list.length > 1).map(([module, list]) => ({ module, list }));
}

// 범위 기본 0~100. ms·dB 처럼 범위가 다른 파라미터는 min/max/unit 으로 받음
const knobStep = (min, max) => (max - min > 200 ? 10 : 1);
const InteractiveKnob = React.memo(({ label, value, color, onChange, size='md', min=0, max=100, unit='', offAtZero=false }) => {
  const frac = Math.max(0, Math.min(1, (value - min) / (max - min)));
  const step = knobStep(min, max);
  const clamp = v => Math.max(min, Math.min(max, v));
  const [editing, setEditing] = useState(false);
  const [inputStr, setInputStr] = useState('');
  const dragging = useRef(false);
  const startY   = useRef(0);
  const startVal = useRef(value);
  const inputRef = useRef(null);
  const dim    = size==='lg' ? 72 : 56;
  const R      = size==='lg' ? 27 : 21;
  const Cx     = dim/2;
  const toRad  = deg => (deg-90)*(Math.PI/180);
  const START  = -135, ARC = 270;
  const valDeg = START+frac*ARC;
  const arcPath = (from, to) => {
    const x1=Cx+R*Math.cos(toRad(from)), y1=Cx+R*Math.sin(toRad(from));
    const x2=Cx+R*Math.cos(toRad(to)),   y2=Cx+R*Math.sin(toRad(to));
    return `M${x1} ${y1} A${R} ${R} 0 ${Math.abs(to-from)>180?1:0} 1 ${x2} ${y2}`;
  };
  // 포인터 이벤트 = 마우스 + 터치(손가락 드래그) 모두 처리
  const onPointerDown = useCallback(e => {
    dragging.current=true; startY.current=e.clientY; startVal.current=value; e.preventDefault();
  }, [value]);
  useEffect(() => {
    const onMove = e => {
      if (!dragging.current) return;
      // 2px 당 1칸 (범위가 넓으면 한 칸 = 10, 예: 10ms)
      onChange(clamp(startVal.current + Math.round((startY.current-e.clientY)/2) * step));
    };
    const onUp = () => { dragging.current=false; };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    return () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onUp); };
  }, [onChange, min, max]);
  const openEdit = () => { setInputStr(String(value)); setEditing(true); };
  useEffect(() => { if (editing && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, [editing]);
  const commitEdit = () => {
    const n = parseInt(inputStr, 10);
    if (!isNaN(n)) onChange(clamp(n));
    setEditing(false);
  };
  const ticks = Array.from({length:13}, (_,i) => {
    const angle = START+(i/12)*ARC;
    const inner=R+2, outer=R+5, ra=toRad(angle);
    return { x1:Cx+inner*Math.cos(ra), y1:Cx+inner*Math.sin(ra), x2:Cx+outer*Math.cos(ra), y2:Cx+outer*Math.sin(ra), lit:i<=Math.round(frac*12) };
  });
  const knobR = size==='lg' ? 14 : 11;
  return (
    <div className="flex flex-col items-center gap-1.5 select-none">
      <div className="relative cursor-ns-resize" onPointerDown={onPointerDown} style={{touchAction:'none'}}>
        <svg width={dim} height={dim} viewBox={`0 0 ${dim} ${dim}`}>
          {ticks.map((t,i) => <line key={i} x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2} stroke={t.lit?color:'#3a3a3a'} strokeWidth="1.5" strokeLinecap="round"/>)}
          <path d={arcPath(START,START+ARC)} fill="none" stroke="#111827" strokeWidth="3" strokeLinecap="round"/>
          {frac>0 && <path d={arcPath(START,valDeg)} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" style={{filter:`drop-shadow(0 0 3px ${color}88)`}}/>}
          <circle cx={Cx} cy={Cx} r={knobR+2} fill="#161616" stroke="#2a2a2a" strokeWidth="1"/>
          <circle cx={Cx} cy={Cx} r={knobR}   fill="url(#kg)" stroke="#333" strokeWidth="1"/>
          <circle cx={Cx+(knobR-3)*Math.cos(toRad(valDeg))} cy={Cx+(knobR-3)*Math.sin(toRad(valDeg))} r="2" fill={color} style={{filter:`drop-shadow(0 0 2px ${color})`}}/>
          <defs><radialGradient id="kg" cx="40%" cy="35%" r="65%"><stop offset="0%" stopColor="#2a2a2a"/><stop offset="100%" stopColor="#0d0d0d"/></radialGradient></defs>
        </svg>
      </div>
      <span className="text-xs uppercase tracking-widest leading-none font-bold" style={{color:color}}>{label}</span>
      {editing ? (
        <input ref={inputRef} inputMode={min<0?'text':'numeric'} className={`${IS_TOUCH?"w-16 text-base":"w-12 text-xs"} text-center font-mono rounded px-1 py-0.5 border outline-none`}
          style={{background:'#0a0a0a',borderColor:color,color}}
          value={inputStr} onChange={e=>setInputStr(e.target.value)}
          onBlur={commitEdit} onKeyDown={e=>{if(e.key==='Enter')commitEdit();if(e.key==='Escape')setEditing(false);}}/>
      ) : (
        <button onDoubleClick={openEdit} onClick={()=>{ if (IS_TOUCH) openEdit(); }} className="text-xs font-mono px-1.5 py-0.5 rounded border border-transparent hover:border-current transition-colors" style={{color}}>{fmtParamValue({unit, min, offAtZero}, value)}</button>
      )}
    </div>
  );
}, (prev, next) => {
  return prev.value === next.value && prev.color === next.color && prev.size === next.size && prev.label === next.label
      && prev.min === next.min && prev.max === next.max && prev.unit === next.unit && prev.offAtZero === next.offAtZero;
});

                              <button onClick={()=>onParamChange(key,Math.max(min,val-step))} className="w-5 h-5 flex items-center justify-center rounded border border-[#1e1e1e] text-gray-400 hover:text-gray-300 transition-colors"><Minus size={9}/></button>
                              <button onClick={()=>onParamChange(key,Math.min(max,val+step))} className="w-5 h-5 flex items-center justify-center rounded border border-[#1e1e1e] text-gray-400 hover:text-gray-300 transition-colors"><Plus size={9}/></button>
                            </div>
                            {p?.hz && <span className="text-[10px] text-gray-500 -mt-0.5">{p.hz}</span>}
                          </div>
                        );
                      })}
                    </div>
                    {others.length > 0 && (
                      <div className="mt-5 space-y-2.5">
                        {others.map(({ key, val, p }) => (
                          <div key={key} className="flex items-center gap-3">
                            <span className="text-xs text-gray-400 uppercase w-20 flex-shrink-0">{key}</span>
                            {typeof val === 'boolean' ? (
                              <button onClick={()=>onParamChange(key,!val)} role="switch" aria-checked={val}
                                className="flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs font-black transition-colors"
                                style={val?{background:`${color.border}22`,borderColor:color.border,color:color.text}:{background:'#111',borderColor:'#2a2a2a',color:'#6b7280'}}>
                                <span className="w-7 h-4 rounded-full relative transition-colors" style={{background:val?color.border:'#333'}}>
                                  <span className="absolute top-0.5 w-3 h-3 rounded-full bg-white transition-all" style={{left:val?'14px':'2px'}}/>
                                </span>
                                {val?'ON':'OFF'}
                              </button>
                            ) : (
                              <div className="flex flex-wrap gap-1">
                                {(p?.o ?? [val]).map(o => (
                                  <button key={o} onClick={()=>onParamChange(key,o)} className="px-2 py-1 rounded-md border text-[11px] font-bold transition-colors"
                                    style={o===val?{background:`${color.border}22`,borderColor:color.border,color:color.text}:{background:'#0d0d0d',borderColor:'#222',color:'#6b7280'}}>{o}</button>
                                ))}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    )}
                    {knobs.length > 0 && (
                      <div className="mt-6 rounded-xl p-4 border" style={{background:'#050505',borderColor:'#151515'}}>
                        <div className="text-xs text-gray-400 uppercase tracking-widest mb-3 flex items-center gap-1.5"><Activity size={9}/> LEVEL</div>
                        <div className="space-y-2">
                          {knobs.map(({ key, val, p }) => {
                            const min = p?.min ?? 0, max = p?.max ?? 100;
                            return (
                              <div key={key} className="flex items-center gap-3">
                                <span className="text-xs text-gray-400 uppercase w-16 text-right flex-shrink-0 truncate">{key}</span>
                                <div className="flex-1 h-1.5 bg-[#161616] rounded-full overflow-hidden">
                                  <div className="h-full rounded-full transition-all duration-200" style={{width:`${(val-min)/(max-min)*100}%`,background:`linear-gradient(90deg,${color.border}55,${color.border})`}}/>
                                </div>
                                <span className="text-xs font-mono w-14 text-right flex-shrink-0" style={{color:color.text}}>{fmtParamValue(p, val)}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </>
                );
              })()}
              <div className="mt-4 text-xs text-gray-500 text-center space-y-0.5">
                <div>↕ 노브를 위아래로 드래그해서 값 조절</div><div>{IS_TOUCH?'숫자 탭':'숫자 더블클릭'} → 직접 입력</div><div>+/- 버튼 → 1단계 미세 조정</div>
              </div>
            </div>
          </>
        )}
      </div>
    </>
  );
}

        className="relative min-w-[72px] p-2.5 rounded-xl border-2 transition-all duration-150 text-center">

}, (prev, next) => {

         prev.forcedOff === next.forcedOff &&

});

function buildPresetJSON(p) { return JSON.stringify({_meta:{device:DEVICE,firmware:FIRMWARE,exported:new Date().toISOString()},preset:p},null,2); }
function buildReadableText(presets) {
  const SEP='═'.repeat(54), sep2='─'.repeat(54), date=new Date().toLocaleString('ko-KR');
  const lines=[SEP,'  TONE CLOUD GP-200JR  —  PRESET BACKUP',`  Device   : ${DEVICE}  (${FIRMWARE})`,`  Guitar   : ${GUITAR}`,`  Exported : ${date}`,`  Presets  : ${presets.length} patches`,SEP,''];
  presets.forEach((p,idx) => {
    const stars='★'.repeat(p.rating)+'☆'.repeat(5-p.rating);
    lines.push(`PATCH ${String(idx+1).padStart(2,'0')}  ${p.name}${p.isAI?'  [AI]':''}`);
    lines.push(`  Artist  : ${p.artist}${p.song?`  /  "${p.song}"`:''}`);
    lines.push(`  Pickup  : ${p.pickup}   Rating: ${stars}`);
    lines.push(`  Tags    : ${p.tags.map(t=>`#${t}`).join('  ')}`);
    lines.push(sep2); lines.push('  SIGNAL CHAIN:');
    p.chain.forEach((b,bi) => {
      const label=FX_LABEL[b.cat]??b.cat, status=b.active?'ON ':'OFF';
      const paramStr=Object.entries(b.params).map(([k,v])=>`${k.toUpperCase()}:${fmtParamValue(paramSpec(b,k),v).padStart(3)}`).join("  ");
      lines.push(`  [${bi+1}] [${status}] ${label.padEnd(12)} ${b.model.padEnd(18)} ${paramStr}`);
    });
    lines.push('');
  });
  lines.push(SEP,'  END OF BACKUP FILE',SEP);
  return lines.join('\n');
}
function triggerDownload(content, filename, mime='application/json') {
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([content],{type:mime})),download:filename});
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
}

function settingCardText(preset, useCab) {
  const lines = [
    `[TONE CLOUD 세팅 카드] ${preset.name}`,
    `아티스트: ${preset.artist}${isRealSong(preset.song) ? ` / 곡: ${preset.song}` : ''}`,
    `기기: ${DEVICE} · 기타: ${GUITAR}`,
    `픽업: ${preset.pickup}`,
    `출력: ${useCab ? 'Direct / Mixer → 기기 No CAB Mode OFF (CAB 사용)' : 'Amp Return → 기기 No CAB Mode ON (또는 CAB 모듈 OFF)'}`,
    '──────────────────────────',
  ];
  preset.chain.forEach((b, i) => {
    const off = !b.active || (!useCab && b.cat === 'CAB');
    const base = MODEL_DB[b.cat]?.models.find(m => m.name === b.model || m.id === b.model)?.base;
    lines.push(`☐ ${i + 1}. [${FX_LABEL[b.cat] ?? b.cat}] ${b.model}${base ? ` (${base})` : ''}${off ? '  ※ OFF' : ''}`);
    if (!off) lines.push(`     ${fmtBlockParams(b)}`);
  });
  return lines.join('\n');
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {   // 구형 브라우저 대비
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
  }
}

const GAIN_LEVELS=['Clean','Light Crunch','Crunch','High Gain','Metal'];
const BRIGHT_LEVELS=['Dark','Warm','Neutral','Bright','Glassy'];
const SPACE_LEVELS=['Dry','Subtle','Moderate','Wet','Ambient'];
const GENRE_LIST=['J-Pop','J-Rock','Blues','Metal','Funk','Jazz','Pop','Punk','Country','R&B'];
const FX_TOGGLES=[{id:'comp',label:'Compressor',cat:'COMP'},{id:'chorus',label:'Chorus',cat:'CHO'},{id:'flanger',label:'Flanger',cat:'FLG'},{id:'phaser',label:'Phaser',cat:'PHS'},{id:'delay',label:'Delay',cat:'DLY'},{id:'reverb',label:'Reverb',cat:'RVB'}];
const DELAY_TYPES=['BBD Delay S','Tape Delay S','Digital Delay S','Slapback','Ping Pong','Pure'];
const REVERB_TYPES=['Room','Hall','Plate','Spring','Shimmer','Sweet Space'];

// CAB 은 항상 넣어둠 — 앰프 리턴 모드에선 화면(OUTPUT MODE)에서 꺼진 것으로만 표시
function wizardGenerate({ artist, song, genres, gainIdx, brightIdx, spaceIdx, fxOn, delayModel, reverbModel }) {
  const id=`wiz-${Date.now()}`, chain=[];
  if (gainIdx>=2||fxOn.includes('ns')) chain.push({cat:'NS',model:'Gate 1',active:true,params:{Threshold:26+gainIdx*5,Release:38}});
  if (fxOn.includes('comp')||gainIdx<=1) chain.push({cat:'COMP',model:gainIdx===0?'COMP4':'COMP',active:true,params:{Attack:22+gainIdx*4,Release:44,Ratio:28+gainIdx*5,Level:68}});
  const isBlues=genres.includes('Blues')||genres.includes('Jazz'), isJPop=genres.includes('J-Pop')||genres.includes('Pop'), isMetal=genres.includes('Metal')||genres.includes('Punk');
  if (gainIdx===1) chain.push({cat:'OD',model:isBlues?'Blues Master':isJPop?'TaiChi OD':'Green OD',active:true,params:{Drive:32+brightIdx*5,Tone:44+brightIdx*7,Level:64}});
  else if (gainIdx===2) chain.push({cat:'OD',model:isBlues?'Blues OD':isMetal?'Revolt':'Force',active:true,params:{Drive:52+brightIdx*3,Tone:50+brightIdx*5,Level:68}});
  else if (gainIdx>=3) chain.push({cat:'OD',model:isMetal?'Swarm':'Precise OD',active:true,params:{Drive:58,Tone:50+brightIdx*4,Level:72}});
  const AMP_TABLE=[isJPop?'J-120 CL':isBlues?'Tweedy':'Dark Twin',isJPop?'Foxy 30N':isBlues?'UK 45':'Match OD',isBlues?'UK SLP':isMetal?'Flagman 1':'UK 800',isMetal?'Mess DualV':'EV 51',isMetal?'Mess DualM':'Eagle 120'];
  const treble=Math.max(25,Math.min(85,[55,58,54,51,48][gainIdx]+(brightIdx-2)*9));
  const mid=Math.max(25,Math.min(80,[54,55,58,54,46][gainIdx]+(brightIdx-2)*3));
  const bass=Math.max(25,Math.min(80,[52,48,48,52,56][gainIdx]-(brightIdx-2)*4));
  chain.push({cat:'AMP',model:AMP_TABLE[gainIdx],active:true,params:{Gain:[16,34,58,74,88][gainIdx],Bass:bass,Mid:mid,Treble:treble,Vol:70,Presence:Math.max(30,Math.min(80,50+(brightIdx-2)*7))}});
  
  let cabModel = 'UK LD';   // 실제 기기 캐비닛 이름
  if (gainIdx === 0) cabModel = isJPop ? 'FOXY 2' : 'Dark Twin';
  else if (gainIdx === 1) cabModel = isBlues ? 'UK GRN 2' : 'FOXY 2';
  else if (gainIdx === 2) cabModel = 'UK GRN 2';
  else cabModel = isMetal ? 'Mess' : 'UK LD';
  chain.push({cat:'CAB',model:cabModel,active:true,params:{HiCut:Math.max(40,58-gainIdx*2),LoCut:Math.min(60,34+gainIdx*2),Mix:100}});

  if (gainIdx>=3||(gainIdx>=2&&isMetal)) chain.push({cat:'EQ',model:'Mess EQ',active:true,params:{Lo:52,LMid:40+(brightIdx-2)*3,Mid:42+(brightIdx-2)*4,HMid:55,Hi:54+(brightIdx-2)*4}});
  if (fxOn.includes('chorus')) chain.push({cat:'CHO',model:brightIdx>=3?'G-Chorus':'A-Chorus',active:true,params:{Rate:28+spaceIdx*5,Depth:gainIdx<=1?42:25,Mix:32+spaceIdx*4}});
  // 코러스·플랜저·페이저는 기기의 MOD 모듈 하나를 같이 써서 1개만 (코러스 > 플랜저 > 페이저)
  else if (fxOn.includes('flanger')) chain.push({cat:'FLG',model:'Jet',active:true,params:{Rate:30,Depth:45,Feedback:38,Mix:32}});
  else if (fxOn.includes('phaser')) chain.push({cat:'PHS',model:'O-Phase',active:true,params:{Rate:35,Depth:50,Mix:38}});
  if (fxOn.includes('delay')||spaceIdx>=2) {
    const dlyModel=delayModel??DELAY_TYPES[Math.min(spaceIdx,5)];
    // Time 은 0~100 기준(×10 = ms). 슬랩백은 짧은 단일 반복(약 90~170ms)이라 따로, 피드백도 거의 없게
    const slap=dlyModel==='Slapback';
    chain.push({cat:'DLY',model:dlyModel,active:true,params:{Time:slap?9+spaceIdx*2:32+spaceIdx*13,Feedback:slap?8:Math.min(55,16+spaceIdx*9),Mix:Math.min(44,10+spaceIdx*8)}});
  }
  if (fxOn.includes('reverb')||spaceIdx>=1) chain.push({cat:'RVB',model:reverbModel??(gainIdx>=3?'Room':REVERB_TYPES[Math.min(spaceIdx+1,5)]),active:true,params:{Decay:Math.min(72,25+spaceIdx*13),Mix:Math.min(52,10+spaceIdx*9)}});
  const gainName=GAIN_LEVELS[gainIdx];
  const name=artist&&song?`Wizard: ${artist} — ${song}`:artist?`Wizard: ${artist} ${gainName}`:`Wizard: ${gainName} / ${BRIGHT_LEVELS[brightIdx]}`;
  // 드라이브 페달은 MODEL_DB 기준 카테고리로 표시 (Revolt 등은 OD가 아니라 DST)
  // 위에서 만든 값(옛 이름·0~100)을 실제 기기 파라미터로 변환 + 밝은 톤이면 앰프 Bright ON
  const realChain = applyAmpBright(chain.map((b,i)=>normalizeBlock({...b,cat:b.cat==='OD'?(modelCategory(b.model)??'OD'):b.cat,id:`${id}-${i}`}, true)), brightIdx>=3);
  return {id,name,artist:artist||'Custom',song:song||'Wizard',tags:[gainName.toLowerCase().replace(' ','-'),...genres.slice(0,3)],pickup:['Neck (1st)','Neck Split (2nd)','Mid (3rd)','Bridge Split (4th)','Bridge HB'][Math.min(gainIdx+1,4)],rating:0,isAI:true,schema:PARAM_SCHEMA,chain:realChain};
}

// MODEL_DB 에서 모델이 속한 카테고리 찾기 (예: 'Revolt' → 'DST')
function modelCategory(name) {
  for (const [cat, entry] of Object.entries(MODEL_DB)) {
    if (entry.models?.some(m => m.name === name || m.id === name)) return cat;
  }
  return null;
}

// 픽업 표기를 Schecter 5-way 셀렉터 표기('Position N: ...')로 통일
function normalizePickup(pk) {
  const p = String(pk).toLowerCase();
  if (p.includes('bridge hb') || p.includes('position 1') || p.includes('full bridge')) return 'Position 1: Full Bridge';
  if (p.includes('bridge split') || p.includes('4th') || p.includes('position 2') || p.includes('inner coils')) return 'Position 2: Inner Coils';
  if (p.includes('mid') || p.includes('3rd') || p.includes('position 3') || p.includes('both humbuckers')) return 'Position 3: Both Humbuckers';
  if (p.includes('neck split') || p.includes('2nd') || p.includes('position 4') || p.includes('outer coils')) return 'Position 4: Outer Coils';
  if (p.includes('neck (1st)') || p.includes('1st') || p.includes('position 5') || p.includes('full neck')) return 'Position 5: Full Neck';
  return pk;
}

// GenreMapper 룰에 적힌 장비(앰프·드라이브·캐비닛·노이즈게이트·픽업)를 체인에 그대로 반영
function applyRuleHardware(preset, rule) {
  let chain = preset.chain.map(b => ({ ...b, params: { ...b.params } }));
  // 룰의 값은 옛 이름(Mid, Vol, Drive …)·0~100 기준 → 새로 끼운 블록만 실제 파라미터로 변환
  // (이미 변환된 나머지 블록을 다시 변환하면 ms·dB 값이 두 번 바뀜)
  const fromRule = b => normalizeBlock(b, true);

  const ampAt = chain.findIndex(b => b.cat === 'AMP');
  if (ampAt !== -1 && rule.amp) chain[ampAt] = fromRule({ ...chain[ampAt], model: rule.amp, params: { ...rule.ampParams } });

  chain = chain.filter(b => b.cat !== 'OD' && b.cat !== 'DST');
  if (rule.od) {
    const ampIdx = chain.findIndex(b => b.cat === 'AMP');
    chain.splice(ampIdx === -1 ? 0 : ampIdx, 0,
      fromRule({ cat: modelCategory(rule.od) ?? 'OD', model: rule.od, active: true, params: { ...rule.odParams } }));
  }

  const cabAt = chain.findIndex(b => b.cat === 'CAB');
  if (cabAt !== -1 && rule.cab) chain[cabAt] = normalizeBlock({ ...chain[cabAt], model: MODEL_RENAMES.CAB[rule.cab] ?? rule.cab });

  chain = chain.filter(b => b.cat !== 'NS');
  if (rule.hasNS) chain.unshift(fromRule({ cat: 'NS', model: 'Gate 1', active: true, params: { Threshold: rule.nsThreshold } }));

  chain = applyAmpBright(chain, rule.brightIdx >= 3);
  return { ...preset, schema: PARAM_SCHEMA, pickup: normalizePickup(rule.pickup), chain: chain.map((b, i) => ({ ...b, id: `${preset.id}-${i}` })) };
}

// gainIdx·brightIdx: 위저드에서 사용자가 직접 고른 값 — 이 값과 반대되는 보정(게인·고음·픽업)은 하지 않음
function toneValidator(preset, genres, { gainIdx = 2, brightIdx = 2 } = {}) {
  if (!preset) return preset;

  // Standardize genres to an array of lowercase strings
  let genreArray = [];
  if (Array.isArray(genres)) {
    genreArray = genres.map(g => String(g).toLowerCase());
  } else if (typeof genres === 'string') {
    genreArray = genres.split(/[\s,]+/).map(g => g.toLowerCase());
  }
  
  // 1. Detect genre categories
  const isMetal = genreArray.some(g => g.includes('metal') || g.includes('djent') || g.includes('heavy'));
  const isRock = genreArray.some(g => (g.includes('rock') || g.includes('classic') || g.includes('modern')) && !g.includes('j-rock') && !g.includes('j-pop'));
  const isJRockPop = genreArray.some(g => g.includes('j-rock') || g.includes('j-pop') || g.includes('japanese') || g.includes('pop'));

  // Find AMP block in signal chain
  const ampBlock = preset.chain.find(b => b.cat === 'AMP');

  // Standardize pickup first
  preset.pickup = normalizePickup(preset.pickup);

  if (isMetal) {
    // 메탈 보정은 사용자가 High Gain 이상을 골랐을 때만 (클린/크런치를 골랐으면 그대로 둠)
    if (ampBlock && gainIdx >= 3) {
      if (ampBlock.params.Gain < 75) ampBlock.params.Gain = 75;
      if (brightIdx >= 2 && 'Treble' in ampBlock.params && ampBlock.params.Treble < 70) ampBlock.params.Treble = 70;
      if ('Presence' in ampBlock.params) ampBlock.params.Presence = 72; // Lock Presence to 72 (Presence 노브가 있는 앰프만)
      if ('Middle' in ampBlock.params) ampBlock.params.Middle = 35; // Scoop Middle to 35
    }
    if (gainIdx >= 2) preset.pickup = 'Position 1: Full Bridge';
    
    // Automatically turn ON the EQ module to ensure directness
    const eqBlock = preset.chain.find(b => b.cat === 'EQ');
    if (eqBlock) {
      eqBlock.active = true;
    }
  } else if (isRock) {
    // 록 게인 범위(50~70)는 크런치를 골랐을 때만 맞춤
    if (ampBlock && gainIdx === 2) {
      if (ampBlock.params.Gain < 50 || ampBlock.params.Gain > 70) {
        ampBlock.params.Gain = 60;
      }
      if ('Middle' in ampBlock.params && ampBlock.params.Middle < 60) ampBlock.params.Middle = 70;
    }
  } else if (isJRockPop) {
    if (ampBlock) {
      // 게인 상한은 Clean·Lt.Crunch 를 골랐을 때만 (High Gain 을 고른 J-Rock 은 그대로)
      if (gainIdx <= 1 && ampBlock.params.Gain > 50) ampBlock.params.Gain = 40;
      if (brightIdx >= 2 && 'Treble' in ampBlock.params && ampBlock.params.Treble < 65) ampBlock.params.Treble = 65;
    }

    // Switch to Position 2: Inner Coils (High Gain 이상은 풀 브리지가 맞으니 그대로)
    const switchPickup = gainIdx <= 2 && (preset.pickup === 'Position 1: Full Bridge' || preset.pickup === 'Position 5: Full Neck');
    if (switchPickup) preset.pickup = 'Position 2: Inner Coils';

    // Volume compensation: Switch to Position 2 outputs lower volume, compensate with +12% volume on AMP (max 95)
    if (switchPickup && ampBlock && ampBlock.params.Volume !== undefined) {
      ampBlock.params.Volume = Math.min(95, Math.round(ampBlock.params.Volume * 1.12));
    }
    
    // Delay and Reverb Mix parameter +15% but capped at 32 (only for J-Rock)
    const isJRock = genreArray.some(g => g.includes('j-rock') || g.includes('jrock'));
    if (isJRock) {
      preset.chain.forEach(b => {
        if ((b.cat === 'DLY' || b.cat === 'RVB') && b.params && b.params.Mix !== undefined) {
          b.params.Mix = Math.min(32, Math.round(b.params.Mix * 1.15));
        }
      });
    }
  }

  return preset;
}

// ── 자동 저장 (브라우저 localStorage) ──────────────────────────────────────
// 사생활 보호 모드 등에서 localStorage 가 막혀 있으면 저장만 건너뛰고 앱은 그대로 동작
const STORAGE_KEY = 'tonecloud.gp200jr.v1';
const isValidPreset = p => p && typeof p.id === 'string' && typeof p.name === 'string' && Array.isArray(p.chain)
  && p.chain.every(b => b && typeof b.cat === 'string' && typeof b.model === 'string' && b.params && typeof b.params === 'object');
function loadSaved() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!data || !Array.isArray(data.presets) || !data.presets.length || !data.presets.every(isValidPreset)) return null;
    return data;
  } catch { return null; }
}
const cloneChain = chain => chain.map(b => ({ ...b, params: { ...b.params } }));

// EXPORT 로 받은 백업(JSON) → 프리셋 배열. 전체 백업 / 단일 프리셋 두 형식 모두 지원
function parseImportedPresets(text) {
  let data;
  try { data = JSON.parse(text); } catch { throw new Error('JSON 파일이 아니에요. EXPORT로 받은 .json 파일을 선택해주세요.'); }
  const list = Array.isArray(data?.presets) ? data.presets : data?.preset ? [data.preset] : Array.isArray(data) ? data : null;
  if (!list) throw new Error('TONE CLOUD 백업 파일 형식이 아니에요.');
  const valid = list
    .map(p => p && { ...p, id: String(p.id ?? `imp-${Math.random().toString(36).slice(2, 8)}`) })
    .filter(isValidPreset)
    .map(p => ({ artist: '', song: '', tags: [], pickup: '', rating: 0, isAI: false, ...p,
      chain: p.chain.map((b, i) => ({ active: true, ...b, id: String(b.id ?? `${p.id}-${i}`), params: { ...b.params } })) }));
  if (!valid.length) throw new Error('가져올 수 있는 프리셋이 없어요.');
  return valid.map(normalizePreset);   // 옛 버전 백업도 실제 기기 파라미터로 변환
}

const SYNC_ERRORS = {
  'auth/unauthorized-domain': '이 주소가 Firebase 승인된 도메인에 없어요. (Authentication → 설정 → 승인된 도메인)',
  'auth/popup-blocked': '팝업이 차단됐어요. 브라우저에서 팝업을 허용해주세요.',
  'auth/network-request-failed': '네트워크 오류로 로그인하지 못했어요.',
  'permission-denied': '클라우드 접근 권한이 없어요. Firestore 규칙을 확인해주세요.',
  'unavailable': '클라우드에 연결할 수 없어요. 잠시 후 자동으로 다시 시도해요.',
  'aborted': '다른 기기와 동시에 저장하느라 잠시 실패했어요. 자동으로 다시 시도해요.',
  'failed-precondition': '다른 기기와 동시에 저장하느라 잠시 실패했어요. 자동으로 다시 시도해요.',
};
const syncErrorMessage = e => SYNC_ERRORS[e?.code] ?? `동기화 오류: ${e?.message ?? e}`;

// ── 동기화 병합: 프리셋 단위 ─────────────────────────────────────────────
// 상태 = { presets, originals, deleted }
//  · 프리셋마다 updatedAt(이 기기에서 마지막으로 고친 시각, ms). 같은 프리셋이 양쪽에 있으면 더 최근 것을 남김
//    → PC 에서 A, 폰에서 B 를 동시에 고쳐도 둘 다 남음 (예전엔 목록 전체를 덮어써서 한쪽이 사라졌음)
//  · deleted = { 프리셋id: 삭제 시각 }. 삭제가 더 나중이면 다른 기기에 남아 있던 프리셋도 지움 (되살아나지 않게)
const TOMBSTONE_TTL = 1000 * 60 * 60 * 24 * 120;   // 120일 지난 삭제 기록은 정리
const presetStamp = p => p.updatedAt || 0;
const emptySyncState = () => ({ presets: [], originals: {}, deleted: {} });
// legacyCopies: 옛 버전 충돌 복사본은 클라우드에 쓰는 병합에서만 만듦 (화면 반영 때 또 만들면 중복)
function mergeSyncStates(remote, local, now = Date.now(), { legacyCopies: makeCopies = true } = {}) {
  const deleted = {};
  for (const src of [remote.deleted, local.deleted])
    for (const [id, t] of Object.entries(src || {})) if (now - t < TOMBSTONE_TTL) deleted[id] = Math.max(deleted[id] || 0, t);
  const R = new Map(remote.presets.map(p => [p.id, p])), L = new Map(local.presets.map(p => [p.id, p]));
  // 손대지 않은 기본 프리셋 — 새 기기에서 로그인해도 클라우드에 섞여 들어가지 않게
  const pristineSigs = new Set(INITIAL_PRESETS.map(presetSignature));
  const isPristine = p => !presetStamp(p) && INITIAL_PRESETS.some(d => d.id === p.id) && pristineSigs.has(presetSignature(p));
  const winners = new Map(), from = {}, legacyCopies = [];
  for (const id of new Set([...R.keys(), ...L.keys()])) {
    const r = R.get(id), l = L.get(id);
    let w;
    if (r && l) {
      if (presetStamp(l) > presetStamp(r)) { w = l; from[id] = 'local'; }
      else {
        w = r; from[id] = 'remote';
        // 수정 시각이 생기기 전(옛 버전)에 두 기기에서 따로 고친 경우 → 이 기기 쪽도 복사본으로 남김
        if (makeCopies && !presetStamp(l) && !presetStamp(r) && presetSignature(l) !== presetSignature(r) && !isPristine(l)) legacyCopies.push(l);
      }
    } else if (r) { w = r; from[id] = 'remote'; }
    else {
      if (remote.presets.length && isPristine(l)) continue;
      w = l; from[id] = 'local';
    }
    if (deleted[id] && deleted[id] >= presetStamp(w)) continue;   // 삭제가 더 나중
    delete deleted[id];   // 삭제 뒤에 다시 고쳐졌거나 되돌리기로 살아남 → 삭제 기록은 필요 없음
    winners.set(id, w);
  }
  // 순서: 클라우드 순서 기준, 이 기기에만 있는 프리셋은 이 기기에서의 앞 이웃 바로 뒤에
  const order = remote.presets.map(p => p.id).filter(id => winners.has(id));
  local.presets.forEach((p, i) => {
    if (!winners.has(p.id) || order.includes(p.id)) return;
    const prev = local.presets.slice(0, i).reverse().find(q => order.includes(q.id));
    order.splice(prev ? order.indexOf(prev.id) + 1 : 0, 0, p.id);
  });
  const presets = order.map(id => winners.get(id));
  const originals = {};
  for (const p of presets) {
    const src = from[p.id] === 'remote' ? (remote.originals?.[p.id] ?? local.originals?.[p.id]) : (local.originals?.[p.id] ?? remote.originals?.[p.id]);
    if (Array.isArray(src)) originals[p.id] = src;
  }
  for (const l of legacyCopies) {
    const id = `${l.id}-dev-${now}-${presets.length}`;
    const copy = { ...l, id, name: `${l.name} (이 기기)`, updatedAt: now, chain: l.chain.map((b, i) => ({ ...b, id: `${id}-${i}` })) };
    presets.splice(presets.findIndex(p => p.id === l.id) + 1, 0, copy);
    originals[id] = cloneChain(copy.chain);
  }
  const addedFromLocal = presets.filter(p => !R.has(p.id)).length;
  return { presets, originals, deleted, addedFromLocal };
}
// 두 상태가 같은지 빠르게 비교 (프리셋 id·순서·수정 시각 + 삭제 기록)
const syncKey = s => JSON.stringify([s.presets.map(p => [p.id, presetStamp(p)]), Object.keys(s.deleted || {}).sort()]);
// 바뀐 프리셋에 수정 시각을 찍고, 사라진 프리셋은 삭제 기록에 남김 (deleted 객체를 직접 고침)
function stampPresetChanges(prev, next, deleted, now = Date.now()) {
  const prevById = new Map(prev.map(p => [p.id, p]));
  const nextIds = new Set(next.map(p => p.id));
  for (const p of prev) if (!nextIds.has(p.id)) deleted[p.id] = now;
  return next.map(p => {
    if (prevById.get(p.id) === p) return p;
    delete deleted[p.id];   // 되돌리기로 다시 생긴 프리셋
    return { ...p, updatedAt: now };
  });
}

function ToneCloudApp() {
  // 저장된 프리셋을 불러오면서 옛 형식은 실제 기기 파라미터로 변환 (한 번만)
  const saved = useMemo(() => { const s = loadSaved(); return s ? { ...s, ...normalizeSavedState(s) } : null; }, []);
  const [presets,setPresetsRaw]=useState(()=>saved?.presets ?? INITIAL_PRESETS);
  // 삭제 기록 (동기화용) — 다른 기기에서 지운 프리셋이 되살아나지 않게
  const deletedRef = useRef(saved?.deleted ?? {});
  // 앱 안에서 프리셋을 바꾸면 자동으로 수정 시각·삭제 기록을 남김 (클라우드에서 받은 변경은 setPresetsRaw 로 그대로)
  const setPresets = useCallback(update => setPresetsRaw(prev => {
    const next = typeof update === 'function' ? update(prev) : update;
    return next === prev ? prev : stampPresetChanges(prev, next, deletedRef.current);
  }), []);
  const [activeId,setActiveId]=useState(()=>saved?.activeId ?? '1');
  const [selBlockId,setSelBlockId]=useState(null);
  const [search,setSearch]=useState('');
  const [activeTags,setActiveTags]=useState([]);
  const [aiQuery,setAiQuery]=useState('');
  const [aiLoading,setAiLoading]=useState(false);
  const [aiPreview,setAiPreview]=useState(null);
  const [useCab,setUseCab]=useState(()=>saved?.useCab ?? true);
  const [showBrowser,setShowBrowser]=useState(false);
  const [showExport,setShowExport]=useState(false);
  const [showWizard,setShowWizard]=useState(false);
  const [aiError,setAiError]=useState(null);
  const [aiNote,setAiNote]=useState(null);
  const [aiCandidates,setAiCandidates]=useState(null);   // { query, list: MusicBrainz 아티스트[], genreOption }
  const [toast,setToast]=useState(null);
  const [showDrawer,setShowDrawer]=useState(false);    // 폰: 프리셋 목록 서랍
  const [showSettingCard,setShowSettingCard]=useState(false);
  const [editingName,setEditingName]=useState(null);   // 이름 변경 중일 때 입력값
  const [confirmDelete,setConfirmDelete]=useState(false);
  const [showAddBlock,setShowAddBlock]=useState(false);   // 체인 끝 [+] → 카테고리 고르기
  const fileInputRef = useRef(null);

  // 블록 RESET 용 원본 체인 (기본 프리셋 + 이후 저장·복제·가져온 프리셋). 새로고침해도 유지되도록 함께 저장
  const originalsRef = useRef(null);
  if (!originalsRef.current) {
    const m = new Map(INITIAL_PRESETS.map(p => [p.id, p.chain]));
    if (saved?.originals) Object.entries(saved.originals).forEach(([id, chain]) => Array.isArray(chain) && m.set(id, chain));
    originalsRef.current = m;
  }
  const rememberOriginal = p => originalsRef.current.set(p.id, cloneChain(p.chain));
  const originalsFor = list => { const ids = new Set(list.map(p => p.id)); return Object.fromEntries([...originalsRef.current].filter(([id]) => ids.has(id))); };
  const adoptOriginals = obj => Object.entries(obj || {}).forEach(([id, chain]) => Array.isArray(chain) && originalsRef.current.set(id, chain));

  // 변경 0.3초 뒤 자동 저장 (노브를 드래그하는 동안 매번 쓰지 않도록)
  useEffect(() => {
    const t = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, presets, activeId, useCab, originals: originalsFor(presets), deleted: deletedRef.current }));
      } catch (e) { console.warn('자동 저장 실패', e); }
    }, 300);
    return () => clearTimeout(t);
  }, [presets, activeId, useCab]);

  // ── 클라우드 동기화 ──
  // 프리셋 목록만 기기 간 공유. 선택한 프리셋·출력 모드는 기기별로 따로 기억
  const [user,setUser]=useState(null);
  const [syncStatus,setSyncStatus]=useState('off');   // off | syncing | synced | error
  const presetsRef = useRef(presets); presetsRef.current = presets;
  const cloudReadyRef = useRef(false);    // 로그인 직후 합치기가 끝났는지
  const remoteApplyRef = useRef(false);   // 다른 기기 변경을 반영한 직후엔 다시 업로드하지 않음

  const cloudRef = () => getFirebase().db.collection('users').doc(user.uid);
  const localSyncState = () => ({ presets: presetsRef.current, originals: originalsFor(presetsRef.current), deleted: deletedRef.current });
  // 클라우드 문서 → 상태 (옛 형식 프리셋은 실제 기기 파라미터로 변환, 옛 문서엔 삭제 기록이 없음)
  const parseCloud = snap => {
    if (!snap.exists) return null;
    let d = null; try { d = JSON.parse(snap.data().data); } catch {}
    if (!Array.isArray(d?.presets) || !d.presets.every(isValidPreset)) return null;
    return { ...normalizeSavedState({ presets: d.presets, originals: d.originals }), deleted: d.deleted && typeof d.deleted === 'object' ? d.deleted : {} };
  };
  // 클라우드 최신본을 읽고 → 이 기기 상태와 합쳐서 → 쓰기를 한 번에 (트랜잭션: 그 사이 다른 기기가 쓰면 자동으로 다시 시도)
  const syncWithCloud = () => getFirebase().db.runTransaction(async tx => {
    const ref = cloudRef();
    const remote = parseCloud(await tx.get(ref)) ?? emptySyncState();
    const merged = mergeSyncStates(remote, localSyncState());
    tx.set(ref, {
      data: JSON.stringify({ version: 2, presets: merged.presets, originals: merged.originals, deleted: merged.deleted }),
      deviceId: DEVICE_ID,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    return { merged, remote };
  });
  // 클라우드 상태를 화면에 반영. 그 사이 이 기기에서 더 고친 내용이 있으면 한 번 더 합쳐서 살림
  // 반환값 true = 이 기기에 클라우드에 없는 변경이 남아 있음 → 다시 올려야 함
  const applyMerged = cloudState => {
    const local = localSyncState(), localKey = syncKey(local);
    const latest = mergeSyncStates(cloudState, local, Date.now(), { legacyCopies: false });
    deletedRef.current = latest.deleted;
    adoptOriginals(latest.originals);
    if (syncKey(latest) !== localKey) {
      const list = latest.presets.length ? latest.presets : INITIAL_PRESETS;   // 전부 지워진 경우 앱이 비지 않게
      remoteApplyRef.current = true;   // 반영으로 생긴 변경은 다시 올리지 않음
      setPresetsRaw(list);
      setActiveId(id => list.some(p => p.id === id) ? id : list[0].id);
    }
    return syncKey(latest) !== syncKey(cloudState);
  };

  useEffect(() => {
    const fb = getFirebase();
    if (!fb) return;
    return fb.auth.onAuthStateChanged(u => setUser(u));
  }, []);

  useEffect(() => {
    cloudReadyRef.current = false;
    if (!user) { setSyncStatus('off'); return; }
    const ref = getFirebase().db.collection('users').doc(user.uid);
    let cancelled = false, unsub = null;
    setSyncStatus('syncing');
    (async () => {
      try {
        // 로그인 직후: 클라우드와 이 기기 프리셋을 프리셋 단위로 합침
        const { merged, remote } = await syncWithCloud();
        if (cancelled) return;
        const pending = applyMerged(merged);
        cloudReadyRef.current = true;
        setSyncStatus('synced');
        if (pending) requestSyncRef.current();
        showToast(!remote.presets.length ? '☁️ 이 기기의 프리셋을 클라우드에 저장했어요'
          : merged.addedFromLocal ? `☁️ 클라우드와 합쳤어요 (이 기기에만 있던 ${merged.addedFromLocal}개 추가)` : '☁️ 클라우드 프리셋을 불러왔어요');

        // 다른 기기에서 바뀐 내용을 실시간으로 받아서 "합침" (덮어쓰지 않음)
        unsub = ref.onSnapshot(s => {
          if (s.metadata.hasPendingWrites || !s.exists) return;
          if (s.data().deviceId === DEVICE_ID) return;   // 내가 쓴 변경
          const remoteNow = parseCloud(s);
          if (!remoteNow) return;
          // 이 기기에 아직 안 올린 변경이 있었으면 합친 결과를 다시 올림
          if (applyMerged(remoteNow)) requestSyncRef.current(); else setSyncStatus('synced');
        }, err => { setSyncStatus('error'); showToast(`⚠️ ${syncErrorMessage(err)}`); });
      } catch (e) {
        if (!cancelled) { setSyncStatus(navigator.onLine === false ? 'offline' : 'error'); showToast(`⚠️ ${syncErrorMessage(e)}`); }
      }
    })();
    return () => { cancelled = true; unsub?.(); clearTimeout(syncTimer.current); };
  }, [user?.uid]);

  // 이 기기에서 바꾼 내용은 0.8초 뒤 클라우드와 합쳐서 올림. 실패하면(오프라인 등) 15초 뒤·인터넷 연결 시 다시 시도
  const syncTimer = useRef(null);
  const syncFailed = useRef(false);
  const requestSync = (delay = 800) => {
    if (!user || !cloudReadyRef.current) return;
    setSyncStatus('syncing');
    clearTimeout(syncTimer.current);
    syncTimer.current = setTimeout(async () => {
      try {
        const { merged } = await syncWithCloud();
        syncFailed.current = false;
        if (applyMerged(merged)) requestSyncRef.current();   // 올리는 사이 더 고친 내용 → 한 번 더
        else setSyncStatus('synced');
      } catch (e) {
        const offline = navigator.onLine === false;
        setSyncStatus(offline ? 'offline' : 'error');
        if (!syncFailed.current) showToast(offline ? '📴 오프라인이에요. 인터넷이 연결되면 자동으로 동기화해요' : `⚠️ ${syncErrorMessage(e)}`);
        syncFailed.current = true;
        syncTimer.current = setTimeout(() => requestSync(0), 15000);
      }
    }, delay);
  };
  const requestSyncRef = useRef(requestSync); requestSyncRef.current = requestSync;
  useEffect(() => {
    if (!user || !cloudReadyRef.current) return;
    if (remoteApplyRef.current) { remoteApplyRef.current = false; return; }
    requestSync();
  }, [presets, user]);
  useEffect(() => {
    const onOnline = () => requestSyncRef.current(0);
    window.addEventListener('online', onOnline);
    return () => window.removeEventListener('online', onOnline);
  }, []);

  const signIn = async () => {
    const fb = getFirebase();
    if (!fb) { showToast('⚠️ 클라우드 기능을 불러오지 못했어요. 네트워크나 광고 차단 확장을 확인해주세요.'); return; }
    const provider = new firebase.auth.GoogleAuthProvider();
    try { await fb.auth.signInWithPopup(provider); }
    catch (e) {
      if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
        try { await fb.auth.signInWithRedirect(provider); return; } catch (e2) { e = e2; }
      }
      showToast(`⚠️ ${syncErrorMessage(e)}`);
    }
  };
  const signOut = async () => {
    await getFirebase()?.auth.signOut();
    showToast('로그아웃했어요. 이 기기의 프리셋은 그대로 남아 있어요');
  };

  const toastTimer = useRef(null);
  // action: { label, onClick } — 토스트 안에 버튼 (예: 삭제 되돌리기). 버튼이 있으면 조금 더 오래 보여줌
  const showToast = (msg, action = null) => {
    setToast({ msg, action }); clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), action ? 6000 : 2800);
  };

  // 프리셋을 바꾸면 이름 편집·삭제 확인 상태는 초기화
  useEffect(() => { setEditingName(null); setConfirmDelete(false); setShowAddBlock(false); }, [activeId]);
  // 삭제 확인 버튼은 3초 안에 다시 누르지 않으면 원래대로
  useEffect(() => { if (!confirmDelete) return; const t = setTimeout(() => setConfirmDelete(false), 3000); return () => clearTimeout(t); }, [confirmDelete]);

  // OUTPUT MODE 는 화면 표시만 바꾼다 — 프리셋 데이터는 건드리지 않음
  const cabForcedOff = b => !useCab && b.cat === 'CAB';

  const active   = presets.find(p=>p.id===activeId)??presets[0];
  const selBlock = active?.chain.find(b=>b.id===selBlockId)??null;
  const allTags  = [...new Set(presets.flatMap(p=>p.tags))];

  const updateParam = useCallback((blockId,key,value) => {
    setPresets(prev=>prev.map(p=>p.id!==activeId?p:{...p,chain:p.chain.map(b=>b.id!==blockId?b:{...b,params:{...b.params,[key]:value}})}));
  }, [activeId]);
  const toggleBlockActive = useCallback((blockId) => {
    setPresets(prev=>prev.map(p=>p.id!==activeId?p:{...p,chain:p.chain.map(b=>b.id!==blockId?b:{...b,active:!b.active})}));
  }, [activeId]);
  // RESET: 원본 모델·값으로 (모델을 바꿨어도 원래 모델로). 원본이 없는 새 블록은 기본값으로
  const resetBlockParams = useCallback((blockId) => {
    const src=originalsRef.current.get(activeId)?.find(b=>b.id===blockId);
    setPresets(prev=>prev.map(p=>p.id!==activeId?p:{...p,chain:p.chain.map(b=>b.id!==blockId?b
      :src?{...b,cat:src.cat,model:src.model,params:{...src.params}}:normalizeBlock({...b,params:{}}))}));
  }, [activeId]);

  // ── 블록 편집: 모델 교체 · 추가 · 삭제 · 이동 ──
  const editChain = fn => setPresets(prev => prev.map(p => p.id !== activeId ? p : { ...p, chain: fn(p.chain) }));
  // 이름이 같은 파라미터(Gain, Volume …)는 값 유지, 새 모델에만 있는 파라미터는 기본값
  const changeBlockModel = (blockId, model) => editChain(chain => chain.map(b => b.id !== blockId ? b : normalizeBlock({ ...b, model })));
  const moveBlock = (blockId, dir) => editChain(chain => {
    const i = chain.findIndex(b => b.id === blockId), j = i + dir;
    if (i === -1 || j < 0 || j >= chain.length) return chain;
    const next = [...chain]; [next[i], next[j]] = [next[j], next[i]]; return next;
  });
  // 새 블록은 기기 모듈 순서(PRE → … → RVB)에 맞는 자리에 넣고 바로 노브 패널을 엶
  const addBlock = cat => {
    const id = `${active.id}-${cat.toLowerCase()}-${Date.now()}`;
    const block = normalizeBlock({ id, cat, model: MODEL_DB[cat].models[0].id, active: true, params: {} });
    const order = b => GP?.modules.indexOf(GP.moduleOf[b.cat]) ?? -1;
    editChain(chain => {
      const at = chain.findIndex(b => order(b) > order(block));
      const next = [...chain]; next.splice(at === -1 ? next.length : at, 0, block); return next;
    });
    setShowAddBlock(false); setSelBlockId(id);
  };
  const removeBlock = blockId => {
    const presetId = active.id, idx = active.chain.findIndex(b => b.id === blockId);
    if (idx === -1) return;
    const removed = active.chain[idx];
    setSelBlockId(null);
    editChain(chain => chain.filter(b => b.id !== blockId));
    showToast(`${removed.model} 블록 삭제됨`, { label: '되돌리기', onClick: () => setPresets(prev => prev.map(p => {
      if (p.id !== presetId || p.chain.some(b => b.id === blockId)) return p;
      const chain = [...p.chain]; chain.splice(Math.min(idx, chain.length), 0, removed); return { ...p, chain };
    })) });
  };

  const selColor   = selBlock?(FX_COLOR[selBlock.cat]??FX_COLOR.EQ):null;
  const selDbEntry = selBlock?MODEL_DB[selBlock.cat]?.models.find(m=>m.name===selBlock.model||m.id===selBlock.model):null;
  const toggleTag  = tag => setActiveTags(prev=>prev.includes(tag)?prev.filter(t=>t!==tag):[...prev,tag]);
  // 2단계 ① 태그로 톤 만들기 — artist 가 null 이면 입력어만으로 장르 판단
  const buildFromTags = (query, artist) => {
    const lq = query.toLowerCase();
    // 득표수(count) 높은 태그가 그 아티스트의 대표 장르
    const tags = (artist?.tags || []).slice().sort((a, b) => b.count - a.count).map(t => t.name.toLowerCase());
    // 검색창에 직접 장르를 쳤을 경우를 대비해 원본 검색어도 보조 태그로 추가 (우선순위는 가장 낮음)
    const combinedTags = [...tags, lq, ...lq.split(/[\s,]+/)];
    const { rule, matched, matchedTag } = window.GenreMapper.mapGenreToHardware(combinedTags);
    const params = window.GenreMapper.ruleToWizardParams(rule);
    const base = wizardGenerate({
      artist: artist?.name || query,
      song: matched ? `Style: ${rule.label}` : 'AI Generated (Fallback)',
      genres: params.genres,
      gainIdx: params.gainIdx,
      brightIdx: params.brightIdx,
      spaceIdx: params.spaceIdx,
      fxOn: params.fxOn,
      delayModel: null,
      reverbModel: null,
    });
    // 룰에 정의된 장비를 최종값으로 반영 (toneValidator 로 다시 덮어쓰지 않음)
    const preset = applyRuleHardware({ ...base, id: `ai-${Date.now()}`, isAI: true }, rule);
    setAiNote(!artist
      ? `입력어 "${matchedTag}"로 장르 판단 → ${rule.label}`
      : matched
        ? `${artist.name} · MusicBrainz 태그 "${matchedTag}" → ${rule.label}`
        : `${artist.name} · 장르 태그 없음 → 기본 톤(${rule.label})`);
    setAiCandidates(null);
    setAiPreview(preset);
  };

  // 2단계 ② MusicBrainz 검색 → 후보가 있으면 "이 아티스트가 맞나요?" 카드로 확인받기
  const handleGenerate = async () => {
    const query = aiQuery.trim();
    if (!query) return;
    setAiLoading(true); setAiError(null); setAiCandidates(null);
    try {
      const res = await fetch(`https://musicbrainz.org/ws/2/artist/?query=${encodeURIComponent(query)}&fmt=json&limit=5`);
      if (!res.ok) {
        setAiError(res.status === 503
          ? 'MusicBrainz 요청이 너무 잦아요. 1~2초 뒤에 다시 시도해주세요.'
          : `MusicBrainz 응답 오류(${res.status}). 잠시 후 다시 시도해주세요.`);
        return;
      }
      const data = await res.json();
      const lq = query.toLowerCase();
      const map = t => window.GenreMapper.mapGenreToHardware(t).matched;
      const queryIsGenre = map([lq]);                          // 입력 전체가 장르 (metal, j-pop …)
      const hasGenreWord = map([lq, ...lq.split(/[\s,]+/)]);   // 장르 단어가 섞여 있음 (ONE OK ROCK …)
      const nameIs = a => [a.name, a['sort-name'], ...(a.aliases || []).map(x => x.name)].some(n => n?.toLowerCase() === lq);

      // 점수 75 미만은 엉뚱한 결과. 입력이 장르 자체면 이름이 정확히 같은 아티스트만
      // (안 그러면 'metal' 검색에 "Various Artists" 같은 결과가 걸림)
      let candidates = (data.artists || []).filter(a => a.score >= 75);
      if (queryIsGenre) candidates = candidates.filter(nameIs);
      candidates = candidates.slice(0, 3);

      if (!candidates.length) {
        if (hasGenreWord) { buildFromTags(query, null); return; }
        setAiError(`'${query}' 아티스트나 장르를 찾지 못했어요. 영문 표기(예: ONE OK ROCK) 또는 장르(예: metal, j-pop)로 입력해보세요.`);
        return;
      }
      setAiCandidates({ query, list: candidates, genreOption: hasGenreWord });
    } catch (e) {
      console.error(e);
      setAiError('네트워크 오류로 MusicBrainz에 연결하지 못했어요. 인터넷 연결을 확인해주세요.');
    } finally {
      setAiLoading(false);
    }
  };
  const saveAI = () => {
    if (!aiPreview) return;
    rememberOriginal(aiPreview);
    setPresets(prev=>[aiPreview,...prev]);
    setActiveId(aiPreview.id); setSelBlockId(null); setAiPreview(null); setAiQuery('');
  };
  const addCabBlock = () => {
    if (active.chain.some(b => b.cat === 'CAB')) return;
    // 실제 기기 캐비닛·파라미터로 (Marshall 1960AV 4x12, 저음 80Hz 정리, 고음은 자르지 않음)
    const cab = normalizeBlock({ id: `${active.id}-cab-${Date.now()}`, cat: 'CAB', model: 'UK LD', active: true, params: { Volume: 50, 'Low Cut': 80, 'Hi Cut': 0 } });
    // RESET 이 되도록 원본에도 추가
    originalsRef.current.set(active.id, [...(originalsRef.current.get(active.id) ?? []), cloneChain([cab])[0]]);
    setPresets(prev => prev.map(p => {
      if (p.id !== active.id || p.chain.some(b => b.cat === 'CAB')) return p;
      const ampIdx = p.chain.findIndex(b => b.cat === 'AMP');
      const chain = [...p.chain];
      chain.splice(ampIdx === -1 ? chain.length : ampIdx + 1, 0, cab);
      return { ...p, chain };
    }));
  };
  const hasCab = active.chain.some(b => b.cat === 'CAB');

  // ── 프리셋 관리 ──
  const updateActive = patch => setPresets(prev => prev.map(p => p.id === active.id ? { ...p, ...patch } : p));
  const commitRename = () => {
    const name = (editingName ?? '').trim();
    if (name && name !== active.name) { updateActive({ name }); showToast('이름을 바꿨어요'); }
    setEditingName(null);
  };
  const setRating = s => updateActive({ rating: active.rating === s ? 0 : s });   // 같은 별을 다시 누르면 0점
  const duplicatePreset = () => {
    const id = `${active.id}-copy-${Date.now()}`;
    const copy = { ...active, id, name: `${active.name} (복사본)`, tags: [...active.tags],
      chain: active.chain.map((b, i) => ({ ...b, id: `${id}-${i}`, params: { ...b.params } })) };
    rememberOriginal(copy);
    setPresets(prev => { const i = prev.findIndex(p => p.id === active.id); const next = [...prev]; next.splice(i + 1, 0, copy); return next; });
    setActiveId(id); setSelBlockId(null);
    showToast('프리셋을 복제했어요');
  };
  const deletePreset = () => {
    if (presets.length <= 1) return;
    if (!confirmDelete) { setConfirmDelete(true); return; }   // 첫 클릭은 확인 단계
    const i = presets.findIndex(p => p.id === active.id);
    const next = presets.filter(p => p.id !== active.id);
    const removed = active, removedOriginal = originalsRef.current.get(active.id);
    originalsRef.current.delete(active.id);
    setPresets(next);
    setActiveId(next[Math.min(i, next.length - 1)].id); setSelBlockId(null);
    // 되돌리기: 원래 자리·RESET 원본까지 복원
    const undo = () => {
      if (removedOriginal) originalsRef.current.set(removed.id, removedOriginal);
      setPresets(prev => {
        if (prev.some(p => p.id === removed.id)) return prev;
        const list = [...prev]; list.splice(Math.min(i, list.length), 0, removed); return list;
      });
      setActiveId(removed.id); setSelBlockId(null);
      showToast(`"${removed.name}" 복원했어요`);
    };
    showToast(`"${active.name}" 삭제됨`, { label: '되돌리기', onClick: undo });
  };

  // ── 가져오기 (EXPORT 백업 JSON) — 기존 프리셋에 합침. 똑같은 프리셋은 건너뜀 ──
  const handleImportFile = async e => {
    const file = e.target.files?.[0];
    e.target.value = '';   // 같은 파일을 다시 골라도 동작하도록
    if (!file) return;
    try {
      const incoming = parseImportedPresets(await file.text());
      const existing = new Set(presets.map(presetSignature));
      const ids = new Set(presets.map(p => p.id));
      const added = []; let skipped = 0;
      for (const p of incoming) {
        const sig = presetSignature(p);
        if (existing.has(sig)) { skipped++; continue; }
        existing.add(sig);   // 파일 안에 같은 프리셋이 두 번 있어도 한 번만
        let preset = p;
        if (ids.has(p.id)) {   // id 만 겹치고 내용이 다르면 새 id 부여
          const id = `${p.id}-imp-${Date.now()}-${added.length}`;
          preset = { ...p, id, chain: p.chain.map((b, i) => ({ ...b, id: `${id}-${i}` })) };
        }
        ids.add(preset.id); added.push(preset); rememberOriginal(preset);
      }
      if (added.length) { setPresets(prev => [...added, ...prev]); setActiveId(added[0].id); setSelBlockId(null); }
      showToast(added.length
        ? `${added.length}개 프리셋을 가져왔어요${skipped ? ` (이미 있는 ${skipped}개는 건너뜀)` : ''}`
        : `새로 가져올 프리셋이 없어요 (${skipped}개 모두 이미 있음)`);
    } catch (err) {
      showToast(`⚠️ ${err.message}`);
    }
  };

  return (
    // 화면 높이에 고정: 헤더·하단 AI 입력은 항상 보이고 가운데만 스크롤 (dvh = 폰 주소창 높이 변화 반영)
    <div className="h-screen h-[100dvh] overflow-hidden bg-[#0a0a0a] text-gray-200 flex flex-col" style={{fontFamily:"'Courier New',Courier,monospace"}}>
      {showBrowser && <ModelBrowser onClose={()=>setShowBrowser(false)}/>}
      {showExport  && <ExportModal presets={presets} active={active} onClose={()=>setShowExport(false)}/>}
      {showSettingCard && <SettingCardModal preset={active} useCab={useCab} onClose={()=>setShowSettingCard(false)} onToast={showToast}/>}
      {showWizard  && <ToneWizardModal useCab={useCab} onClose={()=>setShowWizard(false)} onSave={(preset)=>{rememberOriginal(preset);setPresets(prev=>[preset,...prev]);setActiveId(preset.id);setSelBlockId(null);}}/>}

      <SlideInPanel block={selBlock} dbEntry={selDbEntry} color={selColor??{border:'#3b82f6',bg:'#0a1628',text:'#60a5fa'}}
        note={selBlock&&cabForcedOff(selBlock)?'앰프 리턴 모드라 이 CAB은 꺼진 것으로 표시돼요. 실제 기기에서도 CAB을 끄거나 No CAB Mode를 ON 하세요.':null}
        onClose={()=>setSelBlockId(null)} onParamChange={(key,val)=>updateParam(selBlock.id,key,val)}
        onToggleActive={()=>toggleBlockActive(selBlock.id)} onReset={()=>resetBlockParams(selBlock.id)}
        onModelChange={m=>changeBlockModel(selBlock.id,m)} onMove={d=>moveBlock(selBlock.id,d)} onRemove={()=>removeBlock(selBlock.id)}
        canMove={selBlock?[active.chain[0]?.id!==selBlock.id, active.chain[active.chain.length-1]?.id!==selBlock.id]:[false,false]}/>

      <ToneCloudHeader presetsLength={presets.length} setShowBrowser={setShowBrowser} setShowExport={setShowExport} fileInputRef={fileInputRef}
        user={user} syncStatus={syncStatus} onSignIn={signIn} onSignOut={signOut} onMenu={()=>setShowDrawer(true)} />
      <input ref={fileInputRef} type="file" accept=".json,application/json" className="hidden" onChange={handleImportFile}/>
      {toast && (
        <div className="fixed bottom-32 md:bottom-6 left-1/2 -translate-x-1/2 z-[60] w-max max-w-[92vw] flex items-center gap-3 text-center px-4 py-2.5 rounded-xl border border-[#404040] bg-[#161616] text-sm font-bold text-gray-100 shadow-2xl" role="status">
          <span>{toast.msg}</span>
          {toast.action && (
            <button onClick={()=>{ const a = toast.action; setToast(null); a.onClick(); }}
              className="flex-shrink-0 px-2.5 py-1 rounded-lg border border-blue-500/60 text-blue-300 hover:bg-blue-600 hover:text-white text-xs font-black transition-colors">{toast.action.label}</button>
          )}
        </div>
      )}

      <div className="flex flex-1 overflow-hidden">
        <PresetSidebar 
          presets={presets}
          activeId={activeId}
          setActiveId={setActiveId}
          setSelBlockId={setSelBlockId}
          search={search}
          setSearch={setSearch}
          activeTags={activeTags}
          toggleTag={toggleTag}
          allTags={allTags}
          open={showDrawer}
          onClose={()=>setShowDrawer(false)}
        />

        <main className="flex-1 min-w-0 flex flex-col overflow-y-auto">
          <div className="px-4 md:px-6 py-3 md:py-4 border-b border-[#2a2a2a] flex-shrink-0">
            <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2 sm:gap-3">
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2">
                  {active.isAI&&<Sparkles size={13} className="text-blue-400 flex-shrink-0"/>}
                  {editingName!==null ? (
                    <input autoFocus value={editingName} maxLength={80}
                      onChange={e=>setEditingName(e.target.value)} onBlur={commitRename}
                      onKeyDown={e=>{if(e.key==='Enter')commitRename();if(e.key==='Escape')setEditingName(null);}}
                      className="flex-1 min-w-0 bg-[#161616] border border-blue-600 rounded-lg px-2 py-1 text-base md:text-lg font-black text-white focus:outline-none"/>
                  ) : (
                    <h2 onDoubleClick={()=>setEditingName(active.name)} title="더블클릭해서 이름 변경" className="text-lg md:text-xl font-black text-white tracking-tight leading-snug break-words sm:truncate">{active.name}</h2>
                  )}
                </div>
                <div className="flex flex-wrap items-center gap-3 mt-1.5">
                  <span className="text-[13px] text-gray-500 flex items-center gap-1"><Music size={10}/>{active.artist}</span>
                  {active.song&&<span className="text-[13px] text-gray-400">"{active.song}"</span>}
                  {hasRealArtist(active.artist)&&<YouTubeLink artist={active.artist} song={active.song} compact/>}
                  <span className="text-xs bg-blue-900/25 text-blue-400 px-2 py-0.5 rounded border border-blue-500/20 uppercase tracking-wider">{active.pickup}</span>
                </div>
              </div>
              <div className="flex sm:flex-col items-center sm:items-end justify-between gap-2 flex-shrink-0">
                <div className="flex items-center -ml-1 sm:ml-0" title="별점 (같은 별을 다시 누르면 0점)">
                  {[1,2,3,4,5].map(s=>(
                    <button key={s} onClick={()=>setRating(s)} aria-label={`별점 ${s}점`} className="p-1 sm:p-0.5 md:hover:scale-125 transition-transform">
                      <Star size={13} className={s<=active.rating?'text-yellow-500 fill-yellow-500':'text-gray-600 hover:text-yellow-500'}/>
                    </button>
                  ))}
                </div>
                <div className="flex items-center gap-1">
                  <button onClick={()=>setEditingName(active.name)} title="이름 변경" className="flex items-center gap-1 px-2 py-1 rounded-md border border-[#383838] text-[11px] text-gray-400 hover:text-white hover:border-gray-500 transition-colors"><Pencil size={10}/> 이름</button>
                  <button onClick={duplicatePreset} title="복제" className="flex items-center gap-1 px-2 py-1 rounded-md border border-[#383838] text-[11px] text-gray-400 hover:text-white hover:border-gray-500 transition-colors"><Copy size={10}/> 복제</button>
                  <button onClick={deletePreset} disabled={presets.length<=1} title={presets.length<=1?'마지막 프리셋은 삭제할 수 없어요':'삭제'}
                    className={`flex items-center gap-1 px-2 py-1 rounded-md border text-[11px] transition-colors disabled:opacity-30 ${confirmDelete?'bg-red-600 border-red-500 text-white font-bold':'border-[#383838] text-gray-400 hover:text-red-400 hover:border-red-500/50'}`}>
                    <Trash size={10}/> {confirmDelete?'정말 삭제?':'삭제'}
                  </button>
                </div>
              </div>
            </div>
            <div className="flex flex-wrap gap-1 mt-2.5">
              {active.tags.map(tag=><span key={tag} className="text-xs px-1.5 py-0.5 rounded-full border border-[#1e1e1e] text-gray-400">#{tag}</span>)}
            </div>
          </div>

          <div className="px-4 md:px-6 py-3 md:py-4 border-b border-[#2a2a2a] flex-shrink-0">
            <div className="flex items-center gap-2 mb-3">
              <Activity size={10} className="text-gray-400 flex-shrink-0"/>
              <span className="text-xs text-gray-400 uppercase tracking-widest truncate">SIGNAL CHAIN<span className="hidden sm:inline"> — VALETON GP-200JR</span></span>
              <button onClick={()=>setShowSettingCard(true)} title="GP-200JR에 따라 입력할 수 있는 블록별 체크리스트"
                className="ml-auto flex-shrink-0 flex items-center gap-1.5 px-2.5 py-1 rounded-lg border border-green-500/30 bg-green-900/10 text-[11px] font-bold text-green-400 hover:bg-green-600 hover:text-white transition-colors">📋 세팅 카드</button>
            </div>
            <div className="flex items-center gap-1 overflow-x-auto pb-1">
              <div className="flex items-center gap-1 flex-shrink-0">
                <div className="min-w-[58px] p-2 rounded-xl border border-[#383838] bg-[#161616] text-center">
                  <Guitar size={14} className="text-gray-400 mx-auto mb-1"/>
                  <div className="text-sm text-gray-400 tracking-widest">GUITAR</div>
                </div>
                <ChevronRight size={10} className="text-gray-500"/>
              </div>
              {active.chain.map(block=>(
                <ChainBlock key={block.id} block={block} isSelected={selBlockId===block.id} forcedOff={cabForcedOff(block)}
                  onClick={()=>setSelBlockId(selBlockId===block.id?null:block.id)}/>
              ))}
              <button onClick={()=>setShowAddBlock(v=>!v)} title="블록 추가" aria-label="블록 추가" aria-expanded={showAddBlock}
                className={`flex-shrink-0 mr-1 w-10 self-stretch flex items-center justify-center rounded-xl border-2 border-dashed transition-colors ${showAddBlock?'border-blue-500 text-blue-400 bg-blue-900/15':'border-[#383838] text-gray-500 hover:border-blue-500/60 hover:text-blue-400'}`}>
                <Plus size={16}/>
              </button>
              <div className="min-w-[58px] p-2 rounded-xl border border-[#383838] bg-[#161616] text-center flex-shrink-0">
                <div className="w-3.5 h-3.5 rounded-full bg-green-600 mx-auto mb-1 ring-2 ring-green-400/25"/>
                <div className="text-sm text-gray-400 tracking-widest">OUTPUT</div>
              </div>
            </div>
            {showAddBlock && (
              <div className="mt-2.5 rounded-xl border border-[#2a2a2a] bg-[#0d0d0d] p-3">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs text-gray-400 uppercase tracking-widest">추가할 블록 종류</span>
                  <button onClick={()=>setShowAddBlock(false)} aria-label="닫기" className="text-gray-500 hover:text-white"><X size={13}/></button>
                </div>
                <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-1.5">
                  {Object.entries(MODEL_DB).map(([cat, d]) => {
                    // 같은 모듈에 이미 켜진 블록이 있으면 표시 (기기는 모듈당 1개만)
                    const used = active.chain.some(b => b.active && GP?.moduleOf[b.cat] === GP?.moduleOf[cat]);
                    return (
                      <button key={cat} onClick={()=>addBlock(cat)} title={used?`${GP.moduleOf[cat]} 모듈을 이미 쓰고 있어요 — 추가하면 하나만 켜야 해요`:undefined}
                        className="px-2 py-1.5 rounded-lg border text-[11px] font-bold transition-colors hover:brightness-150"
                        style={{background:d.color.bg,borderColor:`${d.color.border}${used?'25':'55'}`,color:d.color.text,opacity:used?0.5:1}}>
                        {d.label}{used&&<span className="block text-[9px] font-normal text-gray-500">모듈 사용 중</span>}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
            {useCab && !hasCab && (
              <div className="mt-2.5 flex flex-wrap items-center gap-2 px-3 py-2 rounded-lg text-xs font-bold border bg-blue-900/15 border-blue-500/25 text-blue-300">
                <span>ℹ️ 이 프리셋에는 CAB 블록이 없어요. 헤드폰·인터페이스로 들으면 소리가 거칠 수 있어요.</span>
                <button onClick={addCabBlock} className="ml-auto px-2.5 py-1 rounded-md border border-blue-500/50 text-blue-300 hover:bg-blue-600 hover:text-white transition-colors">+ CAB 추가</button>
              </div>
            )}
            {!useCab && hasCab && (
              <div className="mt-2.5 flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-bold border bg-orange-900/15 border-orange-500/30 text-orange-300">
                ⚠️ 앰프 리턴 모드: CAB 블록은 꺼진 것으로 표시돼요. 실제 GP-200JR에서도 CAB 모듈을 끄거나, Global Settings → Input/Output → No CAB Mode를 ON 하세요.
              </div>
            )}
            {moduleConflicts(active.chain).map(({ module, list }) => (
              <div key={module} className="mt-2.5 flex items-start gap-2 px-3 py-2 rounded-lg text-xs font-bold border bg-red-900/15 border-red-500/30 text-red-300">
                ⚠️ 실제 GP-200JR은 {module} 모듈에 이펙트를 하나만 켤 수 있어요: {list.join(' · ')} 중 하나만 ACTIVE로 두세요.
              </div>
            ))}
          </div>

          {/* 전체 값 한눈에 보기 — 기기에 입력할 때 블록을 하나씩 열지 않아도 되게 */}
          <div className="flex-1 px-4 md:px-6 py-4">
            <div className="flex items-center gap-2 mb-3">
              <Sliders size={10} className="text-gray-400 flex-shrink-0"/>
              <span className="text-xs text-gray-400 uppercase tracking-widest">ALL PARAMETERS</span>
              <span className="ml-auto text-[11px] text-gray-500">{IS_TOUCH?'탭':'클릭'}하면 노브 패널이 열려요</span>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-2">
              {active.chain.map((b, i) => {
                const c = FX_COLOR[b.cat] ?? FX_COLOR.EQ, on = b.active && !cabForcedOff(b);
                return (
                  <button key={b.id} onClick={()=>setSelBlockId(b.id)}
                    className="text-left rounded-xl border p-3 transition-colors hover:bg-[#121212]"
                    style={{borderColor:selBlockId===b.id?c.border:`${c.border}30`,background:'#0b0b0b',opacity:on?1:0.45}}>
                    <div className="flex items-baseline gap-2 mb-1.5">
                      <span className="text-[11px] text-gray-500">{i + 1}.</span>
                      <span className="text-[11px] font-black uppercase tracking-wider" style={{color:c.text}}>{FX_LABEL[b.cat] ?? b.cat}</span>
                      <span className="text-sm font-black text-white truncate">{b.model}</span>
                      <span className={`ml-auto text-[10px] font-bold flex-shrink-0 ${on?'text-green-400':'text-gray-500'}`}>{on?'ON':cabForcedOff(b)?'AMP RTN':'OFF'}</span>
                    </div>
                    <div className="flex flex-wrap gap-x-3 gap-y-0.5 text-xs">
                      {Object.entries(b.params).map(([k, v]) => (
                        <span key={k} className="whitespace-nowrap"><span className="text-gray-500">{k}</span> <strong className="text-gray-200">{fmtParamValue(paramSpec(b, k), v)}</strong></span>
                      ))}
                    </div>
                  </button>
                );
              })}
            </div>
            <button onClick={()=>setShowBrowser(true)} className="mt-4 mx-auto flex items-center gap-1.5 text-[13px] text-blue-500 hover:text-blue-400 border border-blue-500/20 hover:border-blue-500/40 px-3 py-1.5 rounded-lg transition-colors"><BookOpen size={11}/> GP-200JR 모델 브라우저 열기</button>
          </div>
        </main>
      </div>

      <ToneCloudFooter 
        aiPreview={aiPreview}
        aiQuery={aiQuery}
        setAiQuery={setAiQuery}
        handleGenerate={handleGenerate}
        aiLoading={aiLoading}
        setShowWizard={setShowWizard}
        useCab={useCab}
        setUseCab={setUseCab}
        saveAI={saveAI}
        setAiPreview={setAiPreview}
        aiError={aiError}
        setAiError={setAiError}
        aiNote={aiNote}
        aiCandidates={aiCandidates}
        onPickCandidate={(query, artist)=>buildFromTags(query, artist)}
        onCancelCandidates={()=>setAiCandidates(null)}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ToneCloudApp />);
  </script>
</body>
</html>
